<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>京都府宮津市 提携店マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;
    padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);
    max-width:min(340px,75vw);font-size:13px}
  #panel input[type=text]{width:100%;margin:3px 0;font-size:13px;box-sizing:border-box}
  .cats label{margin-right:8px;white-space:nowrap}
  .popup a{display:inline-block;margin:3px 6px 0 0}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <a href="index.html">← 自治体一覧</a>
  <div><b>京都府宮津市</b> <span id="count"></span></div>
  <input id="q" type="text" placeholder="店名・エリアで検索">
  <div class="cats" id="cats"></div>
  <button id="locate">📍 現在地</button>
  <a target="_blank" href="https://tp.furunavi.jp/Municipal/PlanSearch?municipalId=1093">ふるなびで見る</a>
  <div style="color:#888;font-size:11px">Data: tp.furunavi.jp (2026-10-07)</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const STORES = [{"ProductId":3437,"Title":"文珠荘　松露亭","Price":100000,"CategoryName":"宿泊施設","Latitude":35.559625,"Longitude":135.1848038,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":4.7,"GoogleReviewCount":134},{"ProductId":3434,"Title":"文珠荘","Price":40000,"CategoryName":"宿泊施設","Latitude":35.5561854,"Longitude":135.1857628,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":4.3,"GoogleReviewCount":654},{"ProductId":3346,"Title":"ワインとお宿　千歳","Price":43000,"CategoryName":"宿泊施設","Latitude":35.557524,"Longitude":135.1850172,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":4.5,"GoogleReviewCount":85},{"ProductId":3347,"Title":"amano-hashidate 幽斎","Price":40000,"CategoryName":"宿泊施設","Latitude":35.5633251,"Longitude":135.1707459,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":4.3,"GoogleReviewCount":30},{"ProductId":5694,"Title":"旅館 髙島屋","Price":15000,"CategoryName":"宿泊施設","Latitude":35.537851,"Longitude":135.192128,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":4.5,"GoogleReviewCount":143},{"ProductId":3342,"Title":"茶六本館","Price":22000,"CategoryName":"宿泊施設","Latitude":35.5368405,"Longitude":135.1918306,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":4.4,"GoogleReviewCount":139},{"ProductId":3426,"Title":"対橋楼","Price":20000,"CategoryName":"宿泊施設","Latitude":35.5576034,"Longitude":135.1848401,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":4.2,"GoogleReviewCount":352},{"ProductId":7699,"Title":"玄妙庵","Price":65000,"CategoryName":"宿泊施設","Latitude":35.5545771,"Longitude":135.1845422,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":4.3,"GoogleReviewCount":92},{"ProductId":3352,"Title":"余花の宿　花笑舞","Price":15000,"CategoryName":"宿泊施設","Latitude":35.5835351,"Longitude":135.205015,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":4.3,"GoogleReviewCount":26},{"ProductId":11859,"Title":"ザ グランリゾート天の橋立","Price":24000,"CategoryName":"宿泊施設","Latitude":35.5787011,"Longitude":135.1879647,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":4.1,"GoogleReviewCount":183},{"ProductId":6250,"Title":"天橋立荘別館 よさの荘","Price":30000,"CategoryName":"宿泊施設","Latitude":35.5445195,"Longitude":135.1896799,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":4,"GoogleReviewCount":92},{"ProductId":5809,"Title":"天橋立ホテル","Price":35000,"CategoryName":"宿泊施設","Latitude":35.558411,"Longitude":135.1818765,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":4,"GoogleReviewCount":1402},{"ProductId":3339,"Title":"天橋立　文人墨客の宿　清輝楼","Price":16000,"CategoryName":"宿泊施設","Latitude":35.5378785,"Longitude":135.1950242,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":4,"GoogleReviewCount":227},{"ProductId":6251,"Title":"天橋立荘","Price":30000,"CategoryName":"宿泊施設","Latitude":35.5514382,"Longitude":135.1873017,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":3.9,"GoogleReviewCount":176},{"ProductId":6252,"Title":"ホテル丹後","Price":9000,"CategoryName":"宿泊施設","Latitude":35.5377739,"Longitude":135.1928372,"AreaName":"天橋立・舞鶴","ProductPrefectureName":"京都府","GoogleReviewRate":3.4,"GoogleReviewCount":239}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
