<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>長野県飯山市 提携店マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;
    padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);
    max-width:min(340px,75vw);font-size:13px}
  #panel input[type=text]{width:100%;margin:3px 0;font-size:13px;box-sizing:border-box}
  .cats label{margin-right:8px;white-space:nowrap}
  .popup a{display:inline-block;margin:3px 6px 0 0}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <a href="index.html">← 自治体一覧</a>
  <div><b>長野県飯山市</b> <span id="count"></span></div>
  <input id="q" type="text" placeholder="店名・エリアで検索">
  <div class="cats" id="cats"></div>
  <button id="locate">📍 現在地</button>
  <a target="_blank" href="https://tp.furunavi.jp/Municipal/PlanSearch?municipalId=844">ふるなびで見る</a>
  <div style="color:#888;font-size:11px">Data: tp.furunavi.jp (2026-10-07)</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const STORES = [{"ProductId":13279,"Title":"うなぎ専門店 本多","Price":4000,"CategoryName":"グルメ","Latitude":36.8526698,"Longitude":138.3652188,"AreaName":"野沢温泉・斑尾・飯山","ProductPrefectureName":"長野県","GoogleReviewRate":4.4,"GoogleReviewCount":926},{"ProductId":7842,"Title":"北信州　北竜湖ホテル","Price":30000,"CategoryName":"宿泊施設","Latitude":36.9032959,"Longitude":138.423118,"AreaName":"野沢温泉・斑尾・飯山","ProductPrefectureName":"長野県","GoogleReviewRate":4.8,"GoogleReviewCount":67},{"ProductId":10657,"Title":"奥信濃 まぼろしのそば処 富倉そば","Price":1000,"CategoryName":"グルメ","Latitude":36.828185,"Longitude":138.354302,"AreaName":"野沢温泉・斑尾・飯山","ProductPrefectureName":"長野県","GoogleReviewRate":4.2,"GoogleReviewCount":632},{"ProductId":7559,"Title":"四季彩の宿かのえ","Price":12000,"CategoryName":"宿泊施設","Latitude":36.9313194,"Longitude":138.3791194,"AreaName":"野沢温泉・斑尾・飯山","ProductPrefectureName":"長野県","GoogleReviewRate":4.4,"GoogleReviewCount":83},{"ProductId":2563,"Title":"手打ちそばの宿　石田屋","Price":9000,"CategoryName":"宿泊施設","Latitude":36.932116,"Longitude":138.3893853,"AreaName":"野沢温泉・斑尾・飯山","ProductPrefectureName":"長野県","GoogleReviewRate":4.2,"GoogleReviewCount":110},{"ProductId":11099,"Title":"かじか亭","Price":1300,"CategoryName":"グルメ","Latitude":36.9112679,"Longitude":138.3155977,"AreaName":"野沢温泉・斑尾・飯山","ProductPrefectureName":"長野県","GoogleReviewRate":4,"GoogleReviewCount":208},{"ProductId":8378,"Title":"純手打ち蕎麦　西乃茶や","Price":2000,"CategoryName":"グルメ","Latitude":36.8241,"Longitude":138.3519,"AreaName":"野沢温泉・斑尾・飯山","ProductPrefectureName":"長野県","GoogleReviewRate":4,"GoogleReviewCount":421},{"ProductId":3538,"Title":"なべくら高原・森の家","Price":15000,"CategoryName":"宿泊施設","Latitude":36.9870415,"Longitude":138.4455871,"AreaName":"野沢温泉・斑尾・飯山","ProductPrefectureName":"長野県","GoogleReviewRate":4.3,"GoogleReviewCount":201},{"ProductId":4537,"Title":"HUNTERS GATE","Price":55000,"CategoryName":"宿泊施設","Latitude":36.9322629,"Longitude":138.3811583,"AreaName":"野沢温泉・斑尾・飯山","ProductPrefectureName":"長野県","GoogleReviewRate":4.8,"GoogleReviewCount":18},{"ProductId":4539,"Title":"Slopeside","Price":44000,"CategoryName":"宿泊施設","Latitude":36.930727,"Longitude":138.386463,"AreaName":"野沢温泉・斑尾・飯山","ProductPrefectureName":"長野県","GoogleReviewRate":4.6,"GoogleReviewCount":22},{"ProductId":2277,"Title":"お宿 本屋敷","Price":11000,"CategoryName":"宿泊施設","Latitude":36.931627,"Longitude":138.391713,"AreaName":"野沢温泉・斑尾・飯山","ProductPrefectureName":"長野県","GoogleReviewRate":4.7,"GoogleReviewCount":67},{"ProductId":4538,"Title":"Togari Cottage","Price":33000,"CategoryName":"宿泊施設","Latitude":36.9265686,"Longitude":138.3830592,"AreaName":"野沢温泉・斑尾・飯山","ProductPrefectureName":"長野県","GoogleReviewRate":5,"GoogleReviewCount":4},{"ProductId":2276,"Title":"モンエール斑尾","Price":15000,"CategoryName":"宿泊施設","Latitude":36.84835,"Longitude":138.2897103,"AreaName":"野沢温泉・斑尾・飯山","ProductPrefectureName":"長野県","GoogleReviewRate":3.9,"GoogleReviewCount":88},{"ProductId":2275,"Title":"斑尾高原ホテル","Price":17000,"CategoryName":"宿泊施設","Latitude":36.8518878,"Longitude":138.2909226,"AreaName":"野沢温泉・斑尾・飯山","ProductPrefectureName":"長野県","GoogleReviewRate":3.9,"GoogleReviewCount":561}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
