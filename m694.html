ctureName":"神奈川県","GoogleReviewRate":4.2,"GoogleReviewCount":302},{"ProductId":9715,"Title":"ホテルニューポートヨコスカ","Price":18000,"CategoryName":"宿泊施設","Latitude":35.2828254,"Longitude":139.6707355,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":4.2,"GoogleReviewCount":170},{"ProductId":9748,"Title":"ナーガ・ラジャ","Price":3000,"CategoryName":"グルメ","Latitude":35.2315878,"Longitude":139.7026113,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":4.2,"GoogleReviewCount":138},{"ProductId":9716,"Title":"ホテルニューヨコスカ","Price":15000,"CategoryName":"宿泊施設","Latitude":35.2814219,"Longitude":139.6667672,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":3.9,"GoogleReviewCount":844},{"ProductId":9605,"Title":"Oceanfront Villa Hale Kahakai","Price":15000,"CategoryName":"宿泊施設","Latitude":35.1977745,"Longitude":139.6693749,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":4.9,"GoogleReviewCount":49},{"ProductId":9912,"Title":"佐島マリーナホテル","Price":18000,"CategoryName":"宿泊施設","Latitude":35.2215907,"Longitude":139.6043131,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":3.9,"GoogleReviewCount":722},{"ProductId":9643,"Title":"湘南リリーフ","Price":10000,"CategoryName":"宿泊施設","Latitude":35.2559621,"Longitude":139.6062934,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":3.6,"GoogleReviewCount":63},{"ProductId":9863,"Title":"SHOWTIME-Ramen-","Price":1000,"CategoryName":"グルメ","Latitude":35.27984,"Longitude":139.6708774,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":3.8,"GoogleReviewCount":420},{"ProductId":11056,"Title":"スミスのいえ湘南Sajima","Price":20000,"CategoryName":"宿泊施設","Latitude":35.2228312,"Longitude":139.6110156,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":5,"GoogleReviewCount":6},{"ProductId":9969,"Title":"ホテルハーバー横須賀","Price":7000,"CategoryName":"宿泊施設","Latitude":35.281175,"Longitude":139.6607491,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":3.8,"GoogleReviewCount":568},{"ProductId":9625,"Title":"&SUN Penthouse","Price":35000,"CategoryName":"宿泊施設","Latitude":35.243505,"Longitude":139.5953177,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":4.5,"GoogleReviewCount":11},{"ProductId":9624,"Title":"&SUN Terrace house","Price":35000,"CategoryName":"宿泊施設","Latitude":35.243505,"Longitude":139.5953177,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":4.5,"GoogleReviewCount":11},{"ProductId":9674,"Title":"酒と宿と不動産-yado-","Price":8000,"CategoryName":"宿泊施設","Latitude":35.2467225,"Longitude":139.7151341,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":4.4,"GoogleReviewCount":14},{"ProductId":10377,"Title":"相模湾ショートクルージング","Price":5500,"CategoryName":"その他","Latitude":35.2215907,"Longitude":139.6043131,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":3.9,"GoogleReviewCount":722},{"ProductId":9908,"Title":"&SUN mini mini","Price":35000,"CategoryName":"宿泊施設","Latitude":35.2361861,"Longitude":139.6001337,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":0,"GoogleReviewCount":0},{"ProductId":9626,"Title":"SAJIMA Funny house","Price":38000,"CategoryName":"宿泊施設","Latitude":35.2284403,"Longitude":139.6056348,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":3,"GoogleReviewCount":1},{"ProductId":9714,"Title":"ホテル横須賀","Price":7000,"CategoryName":"宿泊施設","Latitude":35.2758811,"Longitude":139.6750653,"AreaName":"横須賀・城ヶ島・三浦","ProductPrefectureName":"神奈川県","GoogleReviewRate":3.4,"GoogleReviewCount":401}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
