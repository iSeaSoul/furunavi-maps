<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>岐阜県白川村 提携店マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;
    padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);
    max-width:min(340px,75vw);font-size:13px}
  #panel input[type=text]{width:100%;margin:3px 0;font-size:13px;box-sizing:border-box}
  .cats label{margin-right:8px;white-space:nowrap}
  .popup a{display:inline-block;margin:3px 6px 0 0}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <a href="index.html">← 自治体一覧</a>
  <div><b>岐阜県白川村</b> <span id="count"></span></div>
  <input id="q" type="text" placeholder="店名・エリアで検索">
  <div class="cats" id="cats"></div>
  <button id="locate">📍 現在地</button>
  <a target="_blank" href="https://tp.furunavi.jp/Municipal/PlanSearch?municipalId=950">ふるなびで見る</a>
  <div style="color:#888;font-size:11px">Data: tp.furunavi.jp (2026-10-07)</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const STORES = [{"ProductId":6430,"Title":"文化喫茶　郷愁","Price":500,"CategoryName":"グルメ","Latitude":36.2561359,"Longitude":136.9059441,"AreaName":"飛騨・高山","ProductPrefectureName":"岐阜県","GoogleReviewRate":4.7,"GoogleReviewCount":528},{"ProductId":11723,"Title":"城山館","Price":30000,"CategoryName":"宿泊施設","Latitude":36.2621248,"Longitude":136.9062397,"AreaName":"飛騨・高山","ProductPrefectureName":"岐阜県","GoogleReviewRate":4.9,"GoogleReviewCount":285},{"ProductId":8141,"Title":"御宿 結の庄","Price":36000,"CategoryName":"宿泊施設","Latitude":36.2770525,"Longitude":136.9018478,"AreaName":"飛騨・高山","ProductPrefectureName":"岐阜県","GoogleReviewRate":4.4,"GoogleReviewCount":1079},{"ProductId":6805,"Title":"白川郷 お食事処いろり","Price":2000,"CategoryName":"グルメ","Latitude":36.2609436,"Longitude":136.9068857,"AreaName":"飛騨・高山","ProductPrefectureName":"岐阜県","GoogleReviewRate":4.3,"GoogleReviewCount":1287},{"ProductId":6799,"Title":"トヨタ白川郷自然学校","Price":22000,"CategoryName":"宿泊施設","Latitude":36.2579727,"Longitude":136.8822937,"AreaName":"飛騨・高山","ProductPrefectureName":"岐阜県","GoogleReviewRate":4.4,"GoogleReviewCount":409},{"ProductId":8102,"Title":"いっぷくちな","Price":1000,"CategoryName":"グルメ","Latitude":36.2568165,"Longitude":136.9072718,"AreaName":"飛騨・高山","ProductPrefectureName":"岐阜県","GoogleReviewRate":4.6,"GoogleReviewCount":111},{"ProductId":6714,"Title":"ぜん助家","Price":1000,"CategoryName":"グルメ","Latitude":36.257108,"Longitude":136.9073161,"AreaName":"飛騨・高山","ProductPrefectureName":"岐阜県","GoogleReviewRate":4.4,"GoogleReviewCount":175},{"ProductId":13123,"Title":"料理宿 御母衣","Price":20000,"CategoryName":"宿泊施設","Latitude":36.1485001,"Longitude":136.9109894,"AreaName":"飛騨・高山","ProductPrefectureName":"岐阜県","GoogleReviewRate":4.5,"GoogleReviewCount":102},{"ProductId":6441,"Title":"お食事処 次平","Price":1000,"CategoryName":"グルメ","Latitude":36.1721864,"Longitude":136.9044215,"AreaName":"飛騨・高山","ProductPrefectureName":"岐阜県","GoogleReviewRate":4.3,"GoogleReviewCount":187},{"ProductId":6439,"Title":"天然温泉白川郷の湯","Price":16000,"CategoryName":"宿泊施設","Latitude":36.2610487,"Longitude":136.9062679,"AreaName":"飛騨・高山","ProductPrefectureName":"岐阜県","GoogleReviewRate":4.1,"GoogleReviewCount":1183},{"ProductId":6481,"Title":"飯美館　よしね","Price":16000,"CategoryName":"宿泊施設","Latitude":36.3607996,"Longitude":136.8728782,"AreaName":"飛騨・高山","ProductPrefectureName":"岐阜県","GoogleReviewRate":4.5,"GoogleReviewCount":45},{"ProductId":11724,"Title":"白川郷平瀬温泉 お宿 湯の里","Price":30000,"CategoryName":"宿泊施設","Latitude":36.1683236,"Longitude":136.9051015,"AreaName":"飛騨・高山","ProductPrefectureName":"岐阜県","GoogleReviewRate":4.2,"GoogleReviewCount":101},{"ProductId":13797,"Title":"白川郷あいす工房与ぜ（天然温泉白川郷の湯内）","Price":600,"CategoryName":"グルメ","Latitude":36.2610289,"Longitude":136.9062193,"AreaName":"飛騨・高山","ProductPrefectureName":"岐阜県","GoogleReviewRate":4.2,"GoogleReviewCount":31}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
