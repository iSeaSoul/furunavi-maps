<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>京都府亀岡市 提携店マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;
    padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);
    max-width:min(340px,75vw);font-size:13px}
  #panel input[type=text]{width:100%;margin:3px 0;font-size:13px;box-sizing:border-box}
  .cats label{margin-right:8px;white-space:nowrap}
  .popup a{display:inline-block;margin:3px 6px 0 0}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <a href="index.html">← 自治体一覧</a>
  <div><b>京都府亀岡市</b> <span id="count"></span></div>
  <input id="q" type="text" placeholder="店名・エリアで検索">
  <div class="cats" id="cats"></div>
  <button id="locate">📍 現在地</button>
  <a target="_blank" href="https://tp.furunavi.jp/Municipal/PlanSearch?municipalId=1094">ふるなびで見る</a>
  <div style="color:#888;font-size:11px">Data: tp.furunavi.jp (2026-10-07)</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const STORES = [{"ProductId":6212,"Title":"京・YUNOHANA RESORT 翠泉","Price":36000,"CategoryName":"宿泊施設","Latitude":35.0200444,"Longitude":135.5116011,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":4.7,"GoogleReviewCount":412},{"ProductId":7649,"Title":"すみや亀峰菴","Price":34000,"CategoryName":"宿泊施設","Latitude":35.0212564,"Longitude":135.5057184,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":4.4,"GoogleReviewCount":638},{"ProductId":5015,"Title":"ルイジアナママ亀岡店","Price":3000,"CategoryName":"グルメ","Latitude":35.0042933,"Longitude":135.5825288,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":4.3,"GoogleReviewCount":791},{"ProductId":4544,"Title":"長岡銘竹株式会社亀岡工房","Price":5000,"CategoryName":"その他","Latitude":35.020605,"Longitude":135.5943,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":5,"GoogleReviewCount":126},{"ProductId":4617,"Title":"京料理　松正","Price":15000,"CategoryName":"グルメ","Latitude":35.005931,"Longitude":135.608121,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":4.6,"GoogleReviewCount":172},{"ProductId":4788,"Title":"亀岡牛専門店 牛肉Restaurant 牛楽","Price":2000,"CategoryName":"グルメ","Latitude":35.0100546,"Longitude":135.603482,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":4.3,"GoogleReviewCount":355},{"ProductId":4752,"Title":"Bistro 仙人掌","Price":3000,"CategoryName":"グルメ","Latitude":35.0078973,"Longitude":135.604797,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":4.3,"GoogleReviewCount":338},{"ProductId":2562,"Title":"サンロイヤルホテル亀岡駅前","Price":8000,"CategoryName":"宿泊施設","Latitude":35.0176412,"Longitude":135.5835,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":4.2,"GoogleReviewCount":403},{"ProductId":5114,"Title":"石窯ダイニングはなり","Price":35000,"CategoryName":"グルメ","Latitude":35.0219432,"Longitude":135.5001158,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":4.1,"GoogleReviewCount":1475},{"ProductId":4832,"Title":"里山ダイニング大地","Price":4000,"CategoryName":"グルメ","Latitude":35.0219432,"Longitude":135.5001158,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":4.1,"GoogleReviewCount":1475},{"ProductId":3501,"Title":"里山の休日　京都・烟河","Price":38000,"CategoryName":"宿泊施設","Latitude":35.021849,"Longitude":135.499945,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":4.1,"GoogleReviewCount":1475},{"ProductId":4427,"Title":"天然砥石館","Price":2000,"CategoryName":"その他","Latitude":35.0557514,"Longitude":135.5154666,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":4.4,"GoogleReviewCount":169},{"ProductId":11689,"Title":"蕎食 きむら","Price":3500,"CategoryName":"グルメ","Latitude":35.0504791,"Longitude":135.5489758,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":3.8,"GoogleReviewCount":98},{"ProductId":4681,"Title":"ポントオーク・ティールーム　レストラン","Price":5000,"CategoryName":"グルメ","Latitude":34.9603898,"Longitude":135.5098822,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":3.7,"GoogleReviewCount":152},{"ProductId":11249,"Title":"「離れ」にのうみ","Price":13000,"CategoryName":"宿泊施設","Latitude":35.0086682,"Longitude":135.5851958,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":4.6,"GoogleReviewCount":23},{"ProductId":4646,"Title":"無双心 本店","Price":1000,"CategoryName":"グルメ","Latitude":35.0059081,"Longitude":135.5835492,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":3.8,"GoogleReviewCount":365},{"ProductId":4441,"Title":"そうしんファーム","Price":10000,"CategoryName":"宿泊施設","Latitude":35.0357699,"Longitude":135.4839855,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":4.3,"GoogleReviewCount":43},{"ProductId":11160,"Title":"京都ダイコクバーガー","Price":1500,"CategoryName":"グルメ","Latitude":35.0127505,"Longitude":135.5852619,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":3.8,"GoogleReviewCount":791},{"ProductId":2234,"Title":"松園荘 保津川亭","Price":25000,"CategoryName":"宿泊施設","Latitude":35.0201078,"Longitude":135.5091238,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":4,"GoogleReviewCount":673},{"ProductId":2576,"Title":"おもてなしの宿 渓山閣","Price":25000,"CategoryName":"宿泊施設","Latitude":35.0177879,"Longitude":135.5200195,"AreaName":"亀岡・福知山・湯の花","ProductPrefectureName":"京都府","GoogleReviewRate":3.9,"GoogleReviewCount":1802}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
