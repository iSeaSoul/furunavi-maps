<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;
    padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);
    max-width:min(340px,75vw);font-size:13px}
  #panel input[type=text]{width:100%;margin:3px 0;font-size:13px;box-sizing:border-box}
  .cats label{margin-right:8px;white-space:nowrap}
  .popup a{display:inline-block;margin:3px 6px 0 0}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <a href="index.html">← 自治体一覧</a>
  <div><b>東京都大田区</b> <span id="count"></span></div>
  <input id="q" type="text" placeholder="店名・エリアで検索">
  <div class="cats" id="cats"></div>
  <button id="locate">📍 現在地</button>
  <a target="_blank" href="https://tp.furunavi.jp/Municipal/PlanSearch?municipalId=639">ふるなびで見る</a>
  <div style="color:#888;font-size:11px">Data: tp.furunavi.jp (2026-10-07)</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const STORES = [{"ProductId":12449,"Title":"ザ ロイヤルパークホテル 東京羽田","Price":16000,"CategoryName":"宿泊施設","Latitude":35.5465696,"Longitude":139.7680024,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4.3,"GoogleReviewCount":3183},{"ProductId":12056,"Title":"しなそば天味","Price":2500,"CategoryName":"グルメ","Latitude":35.5633625,"Longitude":139.7127783,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4.4,"GoogleReviewCount":751},{"ProductId":12023,"Title":"板門店","Price":5000,"CategoryName":"グルメ","Latitude":35.5912947,"Longitude":139.718818,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4.4,"GoogleReviewCount":356},{"ProductId":15395,"Title":"クインテッサホテル東京羽田 Comic&Books","Price":5000,"CategoryName":"宿泊施設","Latitude":35.5572693,"Longitude":139.7252096,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4.2,"GoogleReviewCount":1036},{"ProductId":12062,"Title":"インド宮廷料理マシャール","Price":3000,"CategoryName":"グルメ","Latitude":35.5864891,"Longitude":139.7282409,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4.3,"GoogleReviewCount":344},{"ProductId":12060,"Title":"焼き鳥&焼きラム うまいける","Price":3500,"CategoryName":"グルメ","Latitude":35.5630182,"Longitude":139.714767,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4.3,"GoogleReviewCount":324},{"ProductId":12106,"Title":"自然坊","Price":4000,"CategoryName":"グルメ","Latitude":35.57943,"Longitude":139.68948,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4.3,"GoogleReviewCount":321},{"ProductId":12321,"Title":"炭火うなぎ はせ川","Price":5000,"CategoryName":"グルメ","Latitude":35.5783403,"Longitude":139.7315625,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4.2,"GoogleReviewCount":518},{"ProductId":12010,"Title":"聖兆","Price":15000,"CategoryName":"グルメ","Latitude":35.5619826,"Longitude":139.7194317,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4.6,"GoogleReviewCount":54},{"ProductId":12536,"Title":"牛えん-GYUEN-　蒲田店","Price":3500,"CategoryName":"グルメ","Latitude":35.5639714,"Longitude":139.7150127,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4.6,"GoogleReviewCount":41},{"ProductId":12058,"Title":"中華ソバ　ちゃるめ","Price":1300,"CategoryName":"グルメ","Latitude":35.5514517,"Longitude":139.7320653,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4.1,"GoogleReviewCount":580},{"ProductId":14109,"Title":"ジャンボステーキ　はらぺこや","Price":2300,"CategoryName":"グルメ","Latitude":35.5619673,"Longitude":139.7191025,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4.1,"GoogleReviewCount":415},{"ProductId":12061,"Title":"中華そば 梟","Price":1000,"CategoryName":"グルメ","Latitude":35.5642481,"Longitude":139.7083935,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4.1,"GoogleReviewCount":328},{"ProductId":12107,"Title":"じゃんけん 蒲田店","Price":3000,"CategoryName":"グルメ","Latitude":35.560732,"Longitude":139.713685,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4.1,"GoogleReviewCount":89},{"ProductId":12108,"Title":"古民家カフェ 蓮月","Price":2000,"CategoryName":"グルメ","Latitude":35.5772403,"Longitude":139.7038028,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4,"GoogleReviewCount":889},{"ProductId":12104,"Title":"三洋食堂","Price":1500,"CategoryName":"グルメ","Latitude":35.581193,"Longitude":139.7627164,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4,"GoogleReviewCount":507},{"ProductId":11979,"Title":"スーパーホテル東京・ＪＲ蒲田西口","Price":7000,"CategoryName":"宿泊施設","Latitude":35.564787,"Longitude":139.7141405,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":4,"GoogleReviewCount":753},{"ProductId":13790,"Title":"東京∞景","Price":3000,"CategoryName":"グルメ","Latitude":35.5880136,"Longitude":139.727343,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":3.5,"GoogleReviewCount":2},{"ProductId":12448,"Title":"レストラン＆バー テイルウィンド（ザ ロイヤルパークホテル 東京羽田内）","Price":5000,"CategoryName":"グルメ","Latitude":35.5463082,"Longitude":139.7682238,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":3.9,"GoogleReviewCount":104},{"ProductId":11992,"Title":"ホテルアジール東京蒲田","Price":20000,"CategoryName":"宿泊施設","Latitude":35.5631581,"Longitude":139.7142034,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":3.8,"GoogleReviewCount":140},{"ProductId":12388,"Title":"東京イン","Price":10000,"CategoryName":"宿泊施設","Latitude":35.5972505,"Longitude":139.711821,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":3.6,"GoogleReviewCount":723},{"ProductId":12008,"Title":"グランパークホテル パネックス東京","Price":9000,"CategoryName":"宿泊施設","Latitude":35.5633984,"Longitude":139.7177834,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":3.6,"GoogleReviewCount":723},{"ProductId":12059,"Title":"上々家","Price":1500,"CategoryName":"グルメ","Latitude":35.5523389,"Longitude":139.7372629,"AreaName":"品川・大森・蒲田・羽田","ProductPrefectureName":"東京都","GoogleReviewRate":3.4,"GoogleReviewCount":1049}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
