<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沖縄県糸満市 提携店マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;
    padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);
    max-width:min(340px,75vw);font-size:13px}
  #panel input[type=text]{width:100%;margin:3px 0;font-size:13px;box-sizing:border-box}
  .cats label{margin-right:8px;white-space:nowrap}
  .popup a{display:inline-block;margin:3px 6px 0 0}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <a href="index.html">← 自治体一覧</a>
  <div><b>沖縄県糸満市</b> <span id="count"></span></div>
  <input id="q" type="text" placeholder="店名・エリアで検索">
  <div class="cats" id="cats"></div>
  <button id="locate">📍 現在地</button>
  <a target="_blank" href="https://tp.furunavi.jp/Municipal/PlanSearch?municipalId=1707">ふるなびで見る</a>
  <div style="color:#888;font-size:11px">Data: tp.furunavi.jp (2026-10-07)</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const STORES = [{"ProductId":14232,"Title":"糸満漁民食堂","Price":3000,"CategoryName":"グルメ","Latitude":26.139299,"Longitude":127.6599137,"AreaName":"南部","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.4,"GoogleReviewCount":1821},{"ProductId":5312,"Title":"琉球ホテル＆リゾート 名城ビーチ","Price":18000,"CategoryName":"宿泊施設","Latitude":26.1005278,"Longitude":127.6594224,"AreaName":"南部","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.3,"GoogleReviewCount":2426},{"ProductId":5255,"Title":"サザンビーチホテル&リゾート沖縄","Price":20000,"CategoryName":"宿泊施設","Latitude":26.1320273,"Longitude":127.6529371,"AreaName":"南部","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.2,"GoogleReviewCount":4496},{"ProductId":7360,"Title":"コモンズステーキ","Price":1500,"CategoryName":"グルメ","Latitude":26.1460471,"Longitude":127.6689888,"AreaName":"南部","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.6,"GoogleReviewCount":311},{"ProductId":7350,"Title":"クッチーナマンテカーレ","Price":4000,"CategoryName":"グルメ","Latitude":26.1442829,"Longitude":127.6728538,"AreaName":"南部","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.7,"GoogleReviewCount":165},{"ProductId":7319,"Title":"Detox cafe felicidad","Price":1500,"CategoryName":"グルメ","Latitude":26.1384602,"Longitude":127.6688088,"AreaName":"南部","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.6,"GoogleReviewCount":125},{"ProductId":11523,"Title":"グリーン フィールド","Price":2000,"CategoryName":"グルメ","Latitude":26.1375524,"Longitude":127.6707249,"AreaName":"南部","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.3,"GoogleReviewCount":360},{"ProductId":7753,"Title":"味どころ　田舎家","Price":3500,"CategoryName":"グルメ","Latitude":26.1383153,"Longitude":127.6633622,"AreaName":"南部","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.4,"GoogleReviewCount":171},{"ProductId":7354,"Title":"うちな～そば壱蘭","Price":1000,"CategoryName":"グルメ","Latitude":26.1434169,"Longitude":127.6650858,"AreaName":"南部","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.2,"GoogleReviewCount":373},{"ProductId":5878,"Title":"Bells Dairyベルズデイリー","Price":700,"CategoryName":"グルメ","Latitude":26.0891959,"Longitude":127.6610157,"AreaName":"南部","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.3,"GoogleReviewCount":47},{"ProductId":7767,"Title":"プールサイドレストラン「サザンテラス」（サザンビーチホテル＆リゾート沖縄内）","Price":4700,"CategoryName":"グルメ","Latitude":26.1322448,"Longitude":127.6527849,"AreaName":"南部","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.1,"GoogleReviewCount":35},{"ProductId":7769,"Title":"オーシャンビューレストラン「レイール」（サザンビーチホテル＆リゾート沖縄内）","Price":4700,"CategoryName":"グルメ","Latitude":26.1321187,"Longitude":127.6528814,"AreaName":"南部","ProductPrefectureName":"沖縄県","GoogleReviewRate":3.8,"GoogleReviewCount":184}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
