e":"山梨県","GoogleReviewRate":4.1,"GoogleReviewCount":128},{"ProductId":4155,"Title":"0site コーヒー焙煎","Price":2000,"CategoryName":"その他","Latitude":35.8617118,"Longitude":138.5218297,"AreaName":"清里・小淵沢･八ヶ岳","ProductPrefectureName":"山梨県","GoogleReviewRate":4.9,"GoogleReviewCount":23},{"ProductId":4154,"Title":"0site（キャンプ）","Price":4000,"CategoryName":"その他","Latitude":35.8617118,"Longitude":138.5218297,"AreaName":"清里・小淵沢･八ヶ岳","ProductPrefectureName":"山梨県","GoogleReviewRate":4.9,"GoogleReviewCount":23},{"ProductId":4183,"Title":"八ヶ岳ブルーベリー園ダロウ","Price":1600,"CategoryName":"その他","Latitude":35.8705696,"Longitude":138.4144737,"AreaName":"清里・小淵沢･八ヶ岳","ProductPrefectureName":"山梨県","GoogleReviewRate":4.9,"GoogleReviewCount":15},{"ProductId":4015,"Title":"陶房のぎ","Price":3000,"CategoryName":"その他","Latitude":35.833333,"Longitude":138.34213,"AreaName":"清里・小淵沢･八ヶ岳","ProductPrefectureName":"山梨県","GoogleReviewRate":4.7,"GoogleReviewCount":21},{"ProductId":6798,"Title":"PICA八ヶ岳明野","Price":25000,"CategoryName":"宿泊施設","Latitude":35.7898108,"Longitude":138.4835733,"AreaName":"清里・小淵沢･八ヶ岳","ProductPrefectureName":"山梨県","GoogleReviewRate":4.3,"GoogleReviewCount":400},{"ProductId":4318,"Title":"ブルーベリー観光農園O-B-Iベリー","Price":1500,"CategoryName":"その他","Latitude":35.8196235,"Longitude":138.373861,"AreaName":"清里・小淵沢･八ヶ岳","ProductPrefectureName":"山梨県","GoogleReviewRate":4.8,"GoogleReviewCount":8},{"ProductId":4198,"Title":"加藤さくらんぼ農園","Price":2300,"CategoryName":"その他","Latitude":35.8546038,"Longitude":138.4191594,"AreaName":"清里・小淵沢･八ヶ岳","ProductPrefectureName":"山梨県","GoogleReviewRate":4.3,"GoogleReviewCount":49},{"ProductId":4952,"Title":"プレミアムヴィンヤード見学ツアー（Komaki Vineyard）","Price":4500,"CategoryName":"その他","Latitude":35.8536701,"Longitude":138.313938,"AreaName":"清里・小淵沢･八ヶ岳","ProductPrefectureName":"山梨県","GoogleReviewRate":4.3,"GoogleReviewCount":35},{"ProductId":4125,"Title":"甲斐こまベリーファーム","Price":2000,"CategoryName":"その他","Latitude":35.7842042,"Longitude":138.376345,"AreaName":"清里・小淵沢･八ヶ岳","ProductPrefectureName":"山梨県","GoogleReviewRate":5,"GoogleReviewCount":2},{"ProductId":4063,"Title":"ブルーベリー明野","Price":1000,"CategoryName":"その他","Latitude":35.7805836,"Longitude":138.4606112,"AreaName":"清里・小淵沢･八ヶ岳","ProductPrefectureName":"山梨県","GoogleReviewRate":4.2,"GoogleReviewCount":44},{"ProductId":3400,"Title":"テットベリーコテージ","Price":25000,"CategoryName":"宿泊施設","Latitude":35.9063624,"Longitude":138.4337356,"AreaName":"清里・小淵沢･八ヶ岳","ProductPrefectureName":"山梨県","GoogleReviewRate":4.9,"GoogleReviewCount":23},{"ProductId":3395,"Title":"Komaki Vineyard　客室宿泊","Price":24000,"CategoryName":"宿泊施設","Latitude":35.8536701,"Longitude":138.313938,"AreaName":"清里・小淵沢･八ヶ岳","ProductPrefectureName":"山梨県","GoogleReviewRate":4.3,"GoogleReviewCount":35},{"ProductId":4266,"Title":"マルサマルシェ星野リゾートリゾナーレ八ヶ岳店（クラフト体験・スイーツ作り）","Price":2700,"CategoryName":"その他","Latitude":35.8705915,"Longitude":138.3263693,"AreaName":"清里・小淵沢･八ヶ岳","ProductPrefectureName":"山梨県","GoogleReviewRate":3.5,"GoogleReviewCount":21},{"ProductId":3406,"Title":"AYUS VILLA MISEN","Price":56000,"CategoryName":"宿泊施設","Latitude":35.8869423,"Longitude":138.3181692,"AreaName":"清里・小淵沢･八ヶ岳","ProductPrefectureName":"山梨県","GoogleReviewRate":5,"GoogleReviewCount":1}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
