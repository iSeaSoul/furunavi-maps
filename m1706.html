<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;
    padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);
    max-width:min(340px,75vw);font-size:13px}
  #panel input[type=text]{width:100%;margin:3px 0;font-size:13px;box-sizing:border-box}
  .cats label{margin-right:8px;white-space:nowrap}
  .popup a{display:inline-block;margin:3px 6px 0 0}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <a href="index.html">← 自治体一覧</a>
  <div><b>沖縄県名護市</b> <span id="count"></span></div>
  <input id="q" type="text" placeholder="店名・エリアで検索">
  <div class="cats" id="cats"></div>
  <button id="locate">📍 現在地</button>
  <a target="_blank" href="https://tp.furunavi.jp/Municipal/PlanSearch?municipalId=1706">ふるなびで見る</a>
  <div style="color:#888;font-size:11px">Data: tp.furunavi.jp (2026-10-07)</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const STORES = [{"ProductId":14755,"Title":"幸ちゃんそば","Price":1000,"CategoryName":"グルメ","Latitude":26.5940744,"Longitude":127.9747731,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.5,"GoogleReviewCount":1657},{"ProductId":15017,"Title":"カヌチャリゾート","Price":30000,"CategoryName":"宿泊施設","Latitude":26.5489649,"Longitude":128.0765516,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.3,"GoogleReviewCount":2869},{"ProductId":14791,"Title":"屋我地エコツーネット","Price":12000,"CategoryName":"その他","Latitude":26.650703,"Longitude":128.0290999,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.9,"GoogleReviewCount":444},{"ProductId":14792,"Title":"アイネス ヴィラノッツェ 沖縄","Price":90000,"CategoryName":"宿泊施設","Latitude":26.6022292,"Longitude":127.9403652,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.6,"GoogleReviewCount":190},{"ProductId":15000,"Title":"ベストウェスタン沖縄幸喜ビーチ","Price":10000,"CategoryName":"宿泊施設","Latitude":26.5387806,"Longitude":127.9483989,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.3,"GoogleReviewCount":1613},{"ProductId":14738,"Title":"FLAP COFFEE and BAKE SHOP 名護店","Price":1000,"CategoryName":"グルメ","Latitude":26.6034742,"Longitude":127.9602917,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.5,"GoogleReviewCount":564},{"ProductId":15004,"Title":"HEY","Price":1500,"CategoryName":"グルメ","Latitude":26.5906885,"Longitude":127.9827739,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.8,"GoogleReviewCount":214},{"ProductId":14912,"Title":"上原そば","Price":1500,"CategoryName":"グルメ","Latitude":26.6586234,"Longitude":128.0149172,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.5,"GoogleReviewCount":427},{"ProductId":15030,"Title":"やんばるダイニング 松の古民家","Price":6000,"CategoryName":"グルメ","Latitude":26.5940169,"Longitude":127.9773782,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.4,"GoogleReviewCount":623},{"ProductId":14813,"Title":"スカイウォーク","Price":8000,"CategoryName":"その他","Latitude":26.5464102,"Longitude":128.0777758,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.9,"GoogleReviewCount":186},{"ProductId":14804,"Title":"ホテルゆがふいんおきなわ","Price":14000,"CategoryName":"宿泊施設","Latitude":26.5934393,"Longitude":127.96508,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.2,"GoogleReviewCount":1643},{"ProductId":14999,"Title":"スーパーホテル沖縄・名護","Price":8000,"CategoryName":"宿泊施設","Latitude":26.604552,"Longitude":127.9741798,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.3,"GoogleReviewCount":629},{"ProductId":14699,"Title":"Enjoy工房","Price":3000,"CategoryName":"その他","Latitude":26.6254229,"Longitude":127.9716023,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.9,"GoogleReviewCount":136},{"ProductId":14944,"Title":"農家の台所 楽家","Price":2000,"CategoryName":"グルメ","Latitude":26.6019576,"Longitude":127.9511575,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.6,"GoogleReviewCount":131},{"ProductId":14812,"Title":"TEERA SCUBA VENTURES, OKINAWA","Price":12000,"CategoryName":"その他","Latitude":26.6006987,"Longitude":127.9645642,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":5,"GoogleReviewCount":95},{"ProductId":14746,"Title":"SOIL","Price":5500,"CategoryName":"グルメ","Latitude":26.5956506,"Longitude":127.9647561,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.5,"GoogleReviewCount":120},{"ProductId":14740,"Title":"クックハル","Price":2000,"CategoryName":"グルメ","Latitude":26.6123039,"Longitude":127.9935715,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.4,"GoogleReviewCount":154},{"ProductId":14701,"Title":"島豚七輪焼満味","Price":5000,"CategoryName":"グルメ","Latitude":26.6055396,"Longitude":128.0009559,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.2,"GoogleReviewCount":522},{"ProductId":14923,"Title":"Churasan okinawa","Price":8800,"CategoryName":"その他","Latitude":26.5894981,"Longitude":127.9841391,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":5,"GoogleReviewCount":31},{"ProductId":14742,"Title":"島のうまいもん北のうまいもんなごぬふぁ","Price":4000,"CategoryName":"グルメ","Latitude":26.602022,"Longitude":127.974201,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.1,"GoogleReviewCount":106},{"ProductId":15118,"Title":"又吉観光農園レストラン","Price":2000,"CategoryName":"グルメ","Latitude":26.598629,"Longitude":127.9921865,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4,"GoogleReviewCount":309},{"ProductId":14793,"Title":"美ら花　別邸","Price":3000,"CategoryName":"グルメ","Latitude":26.5384866,"Longitude":127.9490576,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4,"GoogleReviewCount":971},{"ProductId":14790,"Title":"TWIN-LINE HOTEL YANBARU OKINAWA JAPAN","Price":20000,"CategoryName":"宿泊施設","Latitude":26.538202,"Longitude":127.9489713,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4,"GoogleReviewCount":887},{"ProductId":14694,"Title":"わんさか大浦パーク","Price":8800,"CategoryName":"その他","Latitude":26.55469,"Longitude":128.040571,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4,"GoogleReviewCount":947}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
