山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":4.2,"GoogleReviewCount":166},{"ProductId":9577,"Title":"とりごろ","Price":3000,"CategoryName":"グルメ","Latitude":34.9943303,"Longitude":139.8607904,"AreaName":"館山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":4.2,"GoogleReviewCount":27},{"ProductId":9806,"Title":"地魚串焼 だるまや","Price":6000,"CategoryName":"グルメ","Latitude":34.9946838,"Longitude":139.8607981,"AreaName":"館山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":4.1,"GoogleReviewCount":97},{"ProductId":9495,"Title":"Ｎｅｗ　ＷｅｓｔＰｅｎｉｎｓｕｌａ　Ｈｏｔｅｌ（ニューウェストペニンシュラホテル）","Price":17000,"CategoryName":"宿泊施設","Latitude":34.9719901,"Longitude":139.7854683,"AreaName":"館山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":4.1,"GoogleReviewCount":65},{"ProductId":9494,"Title":"キッチンリッキー","Price":3000,"CategoryName":"グルメ","Latitude":34.9926811,"Longitude":139.8638051,"AreaName":"館山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":4.3,"GoogleReviewCount":4},{"ProductId":15100,"Title":"館山温泉 ホテル川端","Price":20000,"CategoryName":"宿泊施設","Latitude":34.962924,"Longitude":139.759579,"AreaName":"館山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":4,"GoogleReviewCount":139},{"ProductId":10684,"Title":"らーめん華の蔵 館山店","Price":2000,"CategoryName":"グルメ","Latitude":35.0061111,"Longitude":139.8713889,"AreaName":"館山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":4,"GoogleReviewCount":407},{"ProductId":9558,"Title":"元湯天然温泉　吉祥","Price":13000,"CategoryName":"宿泊施設","Latitude":34.9238807,"Longitude":139.8319383,"AreaName":"館山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":0,"GoogleReviewCount":0},{"ProductId":9487,"Title":"たてやま旬鮨　海の花","Price":2000,"CategoryName":"グルメ","Latitude":34.9949673,"Longitude":139.8615491,"AreaName":"館山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":4,"GoogleReviewCount":441},{"ProductId":12785,"Title":"陽和リトリート","Price":100000,"CategoryName":"宿泊施設","Latitude":34.940353,"Longitude":139.8396291,"AreaName":"館山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":5,"GoogleReviewCount":33},{"ProductId":9801,"Title":"館山美食倶楽部","Price":55000,"CategoryName":"宿泊施設","Latitude":34.9852002,"Longitude":139.8516186,"AreaName":"館山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":4.9,"GoogleReviewCount":35},{"ProductId":9573,"Title":"波奈総本店","Price":4000,"CategoryName":"グルメ","Latitude":34.9930976,"Longitude":139.8615383,"AreaName":"館山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":3.9,"GoogleReviewCount":626},{"ProductId":13882,"Title":"別邸えん館山","Price":17000,"CategoryName":"宿泊施設","Latitude":34.9327337,"Longitude":139.8317657,"AreaName":"館山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":4.2,"GoogleReviewCount":13},{"ProductId":12037,"Title":"スミスのいえrosso館山","Price":20000,"CategoryName":"宿泊施設","Latitude":34.9657419,"Longitude":139.794067,"AreaName":"館山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":3.6,"GoogleReviewCount":5},{"ProductId":10298,"Title":"漁師料理たてやま","Price":3000,"CategoryName":"グルメ","Latitude":34.9829971,"Longitude":139.8719081,"AreaName":"館山・白浜・千倉・木更津","ProductPrefectureName":"千葉県","GoogleReviewRate":3.6,"GoogleReviewCount":2854}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
