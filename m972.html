<style>

  #panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;

":255},{"ProductId":3049,"Title":"伊豆長岡 隠れ家温泉宿 桂の泉","Price":12000,"CategoryName":"宿泊施設","Latitude":35.0327082,"Longitude":138.9334937,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.1,"GoogleReviewCount":83},{"ProductId":8463,"Title":"頼朝の湯本陣","Price":20000,"CategoryName":"宿泊施設","Latitude":35.0372226,"Longitude":138.9350801,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4,"GoogleReviewCount":174},{"ProductId":5958,"Title":"伊古奈荘","Price":16000,"CategoryName":"宿泊施設","Latitude":35.0356319,"Longitude":138.9390517,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4,"GoogleReviewCount":241},{"ProductId":5956,"Title":"弘法の湯　本店","Price":12000,"CategoryName":"宿泊施設","Latitude":35.0380222,"Longitude":138.9358001,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4,"GoogleReviewCount":514},{"ProductId":3219,"Title":"伊豆長岡温泉　おおとり荘","Price":20000,"CategoryName":"宿泊施設","Latitude":35.0383917,"Longitude":138.9369303,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4,"GoogleReviewCount":265},{"ProductId":3080,"Title":"楽山やすだ","Price":20000,"CategoryName":"宿泊施設","Latitude":35.0361647,"Longitude":138.9358739,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4,"GoogleReviewCount":238},{"ProductId":2593,"Title":"伊豆畑毛温泉 大仙家","Price":15000,"CategoryName":"宿泊施設","Latitude":35.0781781,"Longitude":138.9669028,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4,"GoogleReviewCount":281},{"ProductId":2572,"Title":"ニュー八景園","Price":17000,"CategoryName":"宿泊施設","Latitude":35.0271047,"Longitude":138.9317308,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4,"GoogleReviewCount":1397},{"ProductId":4977,"Title":"香湯楼井川（KOUYUROU IKAWA）","Price":15000,"CategoryName":"宿泊施設","Latitude":35.0348647,"Longitude":138.9359272,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":3.9,"GoogleReviewCount":463},{"ProductId":5957,"Title":"弘法の湯　長岡店","Price":14000,"CategoryName":"宿泊施設","Latitude":35.0300197,"Longitude":138.9338156,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":3.9,"GoogleReviewCount":830},{"ProductId":2567,"Title":"ホテル茜","Price":15000,"CategoryName":"宿泊施設","Latitude":35.0333078,"Longitude":138.9304753,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":3.8,"GoogleReviewCount":253},{"ProductId":2272,"Title":"招福の宿 ゑびすや","Price":18000,"CategoryName":"宿泊施設","Latitude":35.0381404,"Longitude":138.9355074,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.4,"GoogleReviewCount":206},{"ProductId":2263,"Title":"伊豆長岡温泉 京急ホテル","Price":20000,"CategoryName":"宿泊施設","Latitude":35.0332259,"Longitude":138.9411451,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.2,"GoogleReviewCount":292},{"ProductId":5475,"Title":"大仁ホテル","Price":11000,"CategoryName":"宿泊施設","Latitude":34.9963003,"Longitude":138.9424995,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":3.8,"GoogleReviewCount":1750},{"ProductId":2301,"Title":"ホテルサンバレー伊豆長岡本館","Price":17000,"CategoryName":"宿泊施設","Latitude":35.0352512,"Longitude":138.9293088,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4,"GoogleReviewCount":1572},{"ProductId":5474,"Title":"伊豆長岡金城館","Price":11000,"CategoryName":"宿泊施設","Latitude":35.0324809,"Longitude":138.9325295,"AreaName":"長岡・修善寺・中伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":3.6,"GoogleReviewCount":742}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
