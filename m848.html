<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>長野県千曲市 提携店マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;
    padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);
    max-width:min(340px,75vw);font-size:13px}
  #panel input[type=text]{width:100%;margin:3px 0;font-size:13px;box-sizing:border-box}
  .cats label{margin-right:8px;white-space:nowrap}
  .popup a{display:inline-block;margin:3px 6px 0 0}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <a href="index.html">← 自治体一覧</a>
  <div><b>長野県千曲市</b> <span id="count"></span></div>
  <input id="q" type="text" placeholder="店名・エリアで検索">
  <div class="cats" id="cats"></div>
  <button id="locate">📍 現在地</button>
  <a target="_blank" href="https://tp.furunavi.jp/Municipal/PlanSearch?municipalId=848">ふるなびで見る</a>
  <div style="color:#888;font-size:11px">Data: tp.furunavi.jp (2026-10-07)</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const STORES = [{"ProductId":10209,"Title":"信州蕎麦わきゅう","Price":2000,"CategoryName":"グルメ","Latitude":36.5330763,"Longitude":138.1039057,"AreaName":"長野","ProductPrefectureName":"長野県","GoogleReviewRate":4.4,"GoogleReviewCount":398},{"ProductId":2997,"Title":"信州の湯　清風園","Price":18000,"CategoryName":"宿泊施設","Latitude":36.481201,"Longitude":138.1437988,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.2,"GoogleReviewCount":522},{"ProductId":5396,"Title":"有田屋旅館","Price":15000,"CategoryName":"宿泊施設","Latitude":36.481225,"Longitude":138.1426573,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.4,"GoogleReviewCount":73},{"ProductId":4874,"Title":"蕎麦料理處萱","Price":2000,"CategoryName":"グルメ","Latitude":36.4914914,"Longitude":138.1511194,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.1,"GoogleReviewCount":760},{"ProductId":6017,"Title":"梅むら旅館うぐいす亭","Price":40000,"CategoryName":"宿泊施設","Latitude":36.478613,"Longitude":138.141512,"AreaName":"長野","ProductPrefectureName":"長野県","GoogleReviewRate":4.2,"GoogleReviewCount":151},{"ProductId":5365,"Title":"戸倉上山田温泉　湯元　上山田ホテル","Price":17000,"CategoryName":"宿泊施設","Latitude":36.4808571,"Longitude":138.1426747,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.1,"GoogleReviewCount":574},{"ProductId":4450,"Title":"更級花織工房（カフェ）","Price":1000,"CategoryName":"グルメ","Latitude":36.5335925,"Longitude":138.1722487,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.8,"GoogleReviewCount":4},{"ProductId":5006,"Title":"湯楽 ゆうざん","Price":11000,"CategoryName":"宿泊施設","Latitude":36.4783714,"Longitude":138.141359,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":3.9,"GoogleReviewCount":153},{"ProductId":4428,"Title":"更級花織工房（体験）","Price":10000,"CategoryName":"その他","Latitude":36.5335925,"Longitude":138.1722487,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.8,"GoogleReviewCount":4},{"ProductId":5003,"Title":"旬樹庵 若の湯","Price":11000,"CategoryName":"宿泊施設","Latitude":36.4780225,"Longitude":138.1416823,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":3.8,"GoogleReviewCount":224},{"ProductId":2115,"Title":"千曲乃湯しげの家","Price":28000,"CategoryName":"宿泊施設","Latitude":36.4824833,"Longitude":138.1436083,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.6,"GoogleReviewCount":135},{"ProductId":5004,"Title":"旬樹庵 菊水","Price":15000,"CategoryName":"宿泊施設","Latitude":36.4788857,"Longitude":138.1421017,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":3.7,"GoogleReviewCount":172},{"ProductId":2218,"Title":"中央ホテル","Price":15000,"CategoryName":"宿泊施設","Latitude":36.481867,"Longitude":138.1418829,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.5,"GoogleReviewCount":116},{"ProductId":5005,"Title":"旬樹庵 柏屋","Price":10000,"CategoryName":"宿泊施設","Latitude":36.4788857,"Longitude":138.1421017,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":3.6,"GoogleReviewCount":314},{"ProductId":2216,"Title":"山風荘","Price":13000,"CategoryName":"宿泊施設","Latitude":36.479389,"Longitude":138.141018,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":3.8,"GoogleReviewCount":145},{"ProductId":2215,"Title":"湯の宿 福寿草","Price":12000,"CategoryName":"宿泊施設","Latitude":36.481688,"Longitude":138.15067,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":3.8,"GoogleReviewCount":178}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
