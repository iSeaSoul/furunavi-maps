itude":34.319495,"Longitude":134.755444,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":4,"GoogleReviewCount":162},{"ProductId":5428,"Title":"休暇村南淡路（キャンプ場）","Price":4500,"CategoryName":"その他","Latitude":34.246277,"Longitude":134.707125,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":4.2,"GoogleReviewCount":176},{"ProductId":10451,"Title":"和牛専門店 牛楽","Price":6000,"CategoryName":"グルメ","Latitude":34.3005194,"Longitude":134.7428611,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":3.9,"GoogleReviewCount":184},{"ProductId":15315,"Title":"釣り船　若松丸","Price":10000,"CategoryName":"その他","Latitude":34.2936723,"Longitude":134.6584769,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":4.7,"GoogleReviewCount":3},{"ProductId":8098,"Title":"海鮮漁師料理 水軍","Price":5000,"CategoryName":"グルメ","Latitude":34.1683341,"Longitude":134.8200004,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":3.8,"GoogleReviewCount":148},{"ProductId":4377,"Title":"淡路島カヤック&SUP教室","Price":4000,"CategoryName":"その他","Latitude":34.316195,"Longitude":134.6815304,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":4.1,"GoogleReviewCount":23},{"ProductId":4419,"Title":"淡路瓦粘土彫刻体験「安冨白土瓦」","Price":2400,"CategoryName":"その他","Latitude":34.319495,"Longitude":134.755444,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":4,"GoogleReviewCount":162},{"ProductId":10611,"Title":"淡路島 C-Side｜Hill Top Terrace","Price":8000,"CategoryName":"宿泊施設","Latitude":34.2556828,"Longitude":134.7022469,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":4.8,"GoogleReviewCount":16},{"ProductId":10612,"Title":"淡路島 C-Side｜Dual View","Price":8000,"CategoryName":"宿泊施設","Latitude":34.2558078,"Longitude":134.7044783,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":4.7,"GoogleReviewCount":16},{"ProductId":2118,"Title":"やぶ萬旅館","Price":22000,"CategoryName":"宿泊施設","Latitude":34.2575417,"Longitude":134.7185306,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":4.3,"GoogleReviewCount":294},{"ProductId":10616,"Title":"淡路島 C-Side｜Marine View","Price":8000,"CategoryName":"宿泊施設","Latitude":34.2552945,"Longitude":134.7045917,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":4.5,"GoogleReviewCount":13},{"ProductId":10615,"Title":"淡路島 C-Side｜Tail Up","Price":8000,"CategoryName":"宿泊施設","Latitude":34.2555327,"Longitude":134.7038052,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":4.5,"GoogleReviewCount":10},{"ProductId":15192,"Title":"カリコリゾート淡路島","Price":30000,"CategoryName":"宿泊施設","Latitude":34.3287263,"Longitude":134.6886135,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":4.3,"GoogleReviewCount":3},{"ProductId":10613,"Title":"淡路島 C-Side｜Marine Terrace","Price":8000,"CategoryName":"宿泊施設","Latitude":34.2556094,"Longitude":134.7045035,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":4.1,"GoogleReviewCount":9},{"ProductId":10614,"Title":"淡路島 C-Side｜Sky Arena","Price":8000,"CategoryName":"宿泊施設","Latitude":34.2551769,"Longitude":134.7039911,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":4,"GoogleReviewCount":11},{"ProductId":4324,"Title":"淡路ファームパーク　イングランドの丘","Price":1600,"CategoryName":"その他","Latitude":34.306848,"Longitude":134.801526,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":3.9,"GoogleReviewCount":4666},{"ProductId":2190,"Title":"グランドメルキュール淡路島リゾート＆スパ","Price":25000,"CategoryName":"宿泊施設","Latitude":34.2477295,"Longitude":134.6988471,"AreaName":"淡路島","ProductPrefectureName":"兵庫県","GoogleReviewRate":3.8,"GoogleReviewCount":3226}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
