<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>山梨県富士吉田市 提携店マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;
    padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);
    max-width:min(340px,75vw);font-size:13px}
  #panel input[type=text]{width:100%;margin:3px 0;font-size:13px;box-sizing:border-box}
  .cats label{margin-right:8px;white-space:nowrap}
  .popup a{display:inline-block;margin:3px 6px 0 0}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <a href="index.html">← 自治体一覧</a>
  <div><b>山梨県富士吉田市</b> <span id="count"></span></div>
  <input id="q" type="text" placeholder="店名・エリアで検索">
  <div class="cats" id="cats"></div>
  <button id="locate">📍 現在地</button>
  <a target="_blank" href="https://tp.furunavi.jp/Municipal/PlanSearch?municipalId=806">ふるなびで見る</a>
  <div style="color:#888;font-size:11px">Data: tp.furunavi.jp (2026-10-07)</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const STORES = [{"ProductId":14130,"Title":"富士急ハイランド","Price":7900,"CategoryName":"その他","Latitude":35.4869467,"Longitude":138.7805511,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":4.3,"GoogleReviewCount":26474},{"ProductId":7402,"Title":"ハイランドリゾートホテル＆スパ","Price":25000,"CategoryName":"宿泊施設","Latitude":35.4845965,"Longitude":138.7781016,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":4.4,"GoogleReviewCount":2805},{"ProductId":2863,"Title":"ホテルマイステイズ富士山展望温泉","Price":14000,"CategoryName":"宿泊施設","Latitude":35.491827,"Longitude":138.780073,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":4.3,"GoogleReviewCount":3255},{"ProductId":2362,"Title":"富士グランヴィラーTOKI","Price":20000,"CategoryName":"宿泊施設","Latitude":35.4895702,"Longitude":138.7751199,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":4.6,"GoogleReviewCount":632},{"ProductId":13730,"Title":"BLANC FUJI","Price":34000,"CategoryName":"宿泊施設","Latitude":35.4618727,"Longitude":138.8117661,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":4.7,"GoogleReviewCount":170},{"ProductId":10674,"Title":"（日帰り温泉）ふじやま温泉","Price":1600,"CategoryName":"その他","Latitude":35.4834879,"Longitude":138.7794548,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":4.1,"GoogleReviewCount":3532},{"ProductId":7411,"Title":"カフェ ブリオッシュ（富士急ハイランド内）","Price":1000,"CategoryName":"グルメ","Latitude":35.4851389,"Longitude":138.7786262,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":4.2,"GoogleReviewCount":80},{"ProductId":7409,"Title":"日本料理 こころぎ（ハイランドリゾート ホテル＆スパ内）","Price":8000,"CategoryName":"グルメ","Latitude":35.4844651,"Longitude":138.7784075,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":4.1,"GoogleReviewCount":51},{"ProductId":8018,"Title":"麺’ズ　冨士山本店","Price":1000,"CategoryName":"グルメ","Latitude":35.4748668,"Longitude":138.7796453,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":4,"GoogleReviewCount":433},{"ProductId":7731,"Title":"富士山ステーションホテル","Price":13000,"CategoryName":"宿泊施設","Latitude":35.4849415,"Longitude":138.7946315,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":4,"GoogleReviewCount":719},{"ProductId":7408,"Title":"リゾートダイニング　フジヤマテラス（ハイランドリゾート ホテル＆スパ内）","Price":7000,"CategoryName":"グルメ","Latitude":35.4847885,"Longitude":138.7778316,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":4,"GoogleReviewCount":260},{"ProductId":7410,"Title":"レ レーヴ サロン・ド・テ（富士急ハイランド内）","Price":1000,"CategoryName":"グルメ","Latitude":35.4851737,"Longitude":138.7789485,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":3.9,"GoogleReviewCount":69},{"ProductId":14840,"Title":"やすらぎの別邸 四季亭","Price":20000,"CategoryName":"宿泊施設","Latitude":35.4807716,"Longitude":138.8288685,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":3.6,"GoogleReviewCount":29},{"ProductId":7407,"Title":"MACARONI CLUB（ハイランドリゾート ホテル＆スパ内）","Price":2000,"CategoryName":"グルメ","Latitude":35.4843694,"Longitude":138.7780801,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":3.8,"GoogleReviewCount":150},{"ProductId":2156,"Title":"富士山リゾートログハウス ふようの宿","Price":13000,"CategoryName":"宿泊施設","Latitude":35.4789481,"Longitude":138.7840314,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":4.5,"GoogleReviewCount":226},{"ProductId":3798,"Title":"ガーデンヴィラ","Price":15000,"CategoryName":"宿泊施設","Latitude":35.4639634,"Longitude":138.7717276,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":4.7,"GoogleReviewCount":31},{"ProductId":14562,"Title":"亀の井ホテル 富士","Price":20000,"CategoryName":"宿泊施設","Latitude":35.465184,"Longitude":138.772168,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":3.8,"GoogleReviewCount":337},{"ProductId":6795,"Title":"PICA富士吉田","Price":25000,"CategoryName":"宿泊施設","Latitude":35.4588772,"Longitude":138.7694469,"AreaName":"河口湖・富士五湖","ProductPrefectureName":"山梨県","GoogleReviewRate":4,"GoogleReviewCount":419}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
