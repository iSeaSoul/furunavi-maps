ewRate":4.1,"GoogleReviewCount":684},{"ProductId":4758,"Title":"スキューバダイビング　今帰仁ブルー","Price":10000,"CategoryName":"その他","Latitude":26.6950721,"Longitude":127.9529839,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":5,"GoogleReviewCount":15},{"ProductId":4766,"Title":"KOURI VILLA Indigo","Price":18000,"CategoryName":"宿泊施設","Latitude":26.698504,"Longitude":128.0137054,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.8,"GoogleReviewCount":76},{"ProductId":12444,"Title":"YAWN YARD Kouri Island(sea)","Price":70000,"CategoryName":"宿泊施設","Latitude":26.6998029,"Longitude":128.0119034,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.8,"GoogleReviewCount":69},{"ProductId":4722,"Title":"染織工房バナナネシア","Price":10000,"CategoryName":"その他","Latitude":26.6854665,"Longitude":127.960408,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":5,"GoogleReviewCount":8},{"ProductId":4754,"Title":"Botanica","Price":4000,"CategoryName":"その他","Latitude":26.69878,"Longitude":127.9358685,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.9,"GoogleReviewCount":9},{"ProductId":13316,"Title":"ラ・カシータ古宇利島","Price":38000,"CategoryName":"宿泊施設","Latitude":26.712104,"Longitude":128.0161896,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":5,"GoogleReviewCount":34},{"ProductId":4982,"Title":"美ら産プランニング","Price":1700,"CategoryName":"その他","Latitude":26.7019768,"Longitude":127.9250788,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":5,"GoogleReviewCount":6},{"ProductId":9267,"Title":"MAGACHABARU OKINAWA","Price":120000,"CategoryName":"宿泊施設","Latitude":26.6789069,"Longitude":127.9279792,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.6,"GoogleReviewCount":91},{"ProductId":12445,"Title":"YAWN YARD Kouri Island(hill)","Price":70000,"CategoryName":"宿泊施設","Latitude":26.6984468,"Longitude":128.0138824,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.7,"GoogleReviewCount":21},{"ProductId":14649,"Title":"プライベートプールヴィラ古宇利 The Sweet","Price":48000,"CategoryName":"宿泊施設","Latitude":26.7037783,"Longitude":128.0100335,"AreaName":"名護・本部・国頭","ProductPrefectureName":"沖縄県","GoogleReviewRate":4.8,"GoogleReviewCount":8}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
