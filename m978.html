":"静岡県","GoogleReviewRate":4.8,"GoogleReviewCount":50},{"ProductId":14975,"Title":"Il Azzurri","Price":30000,"CategoryName":"宿泊施設","Latitude":34.7843755,"Longitude":138.7656706,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.2,"GoogleReviewCount":765},{"ProductId":11358,"Title":"やまびこ荘","Price":5000,"CategoryName":"宿泊施設","Latitude":34.812764,"Longitude":138.826198,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.3,"GoogleReviewCount":270},{"ProductId":11410,"Title":"ペットと泊まれる宿　シーガル","Price":15000,"CategoryName":"宿泊施設","Latitude":34.7668403,"Longitude":138.7779368,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.3,"GoogleReviewCount":192},{"ProductId":15461,"Title":"温泉民宿 保海荘","Price":10000,"CategoryName":"宿泊施設","Latitude":34.777387,"Longitude":138.768256,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.4,"GoogleReviewCount":77},{"ProductId":11364,"Title":"黄金崎ダイブセンター","Price":5500,"CategoryName":"その他","Latitude":34.8425126,"Longitude":138.7668936,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.6,"GoogleReviewCount":128},{"ProductId":14103,"Title":"旅の宿 ふかい","Price":16000,"CategoryName":"宿泊施設","Latitude":34.7776695,"Longitude":138.7674442,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.3,"GoogleReviewCount":88},{"ProductId":11360,"Title":"西天城高原 牧場の家（レストラン）","Price":1500,"CategoryName":"グルメ","Latitude":34.8572811,"Longitude":138.8384587,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.1,"GoogleReviewCount":675},{"ProductId":11580,"Title":"マリンステーション堂ヶ島","Price":13200,"CategoryName":"その他","Latitude":34.7832138,"Longitude":138.7673623,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.8,"GoogleReviewCount":38},{"ProductId":11119,"Title":"田子ダイビングセンター","Price":17000,"CategoryName":"その他","Latitude":34.8011207,"Longitude":138.7588348,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.5,"GoogleReviewCount":93},{"ProductId":11343,"Title":"居酒屋＆BAR　T's","Price":5000,"CategoryName":"グルメ","Latitude":34.7716932,"Longitude":138.7731971,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.2,"GoogleReviewCount":31},{"ProductId":11362,"Title":"海岸キャンプ 宇久須キャンプ場","Price":5500,"CategoryName":"その他","Latitude":34.8545339,"Longitude":138.7765388,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.2,"GoogleReviewCount":235},{"ProductId":11391,"Title":"西伊豆ダイビングサービス UMIKOZOU","Price":16000,"CategoryName":"その他","Latitude":34.827445,"Longitude":138.7679974,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.7,"GoogleReviewCount":15},{"ProductId":13019,"Title":"AQUA VILLGE","Price":20000,"CategoryName":"その他","Latitude":34.8137738,"Longitude":138.7545313,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.4,"GoogleReviewCount":20},{"ProductId":11359,"Title":"西天城高原　牧場の家","Price":13000,"CategoryName":"宿泊施設","Latitude":34.8572811,"Longitude":138.8384587,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":4.1,"GoogleReviewCount":675},{"ProductId":11361,"Title":"黄金崎クリスタルパーク　リリカ","Price":1000,"CategoryName":"グルメ","Latitude":34.8441242,"Longitude":138.7685074,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":3.6,"GoogleReviewCount":1121},{"ProductId":11365,"Title":"（体験工房）黄金崎クリスタルパーク","Price":2000,"CategoryName":"その他","Latitude":34.8441242,"Longitude":138.7685074,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":3.6,"GoogleReviewCount":1121},{"ProductId":11355,"Title":"（黄金崎ガラスミュージアム）黄金崎クリスタルパーク","Price":2700,"CategoryName":"その他","Latitude":34.8441242,"Longitude":138.7685074,"AreaName":"堂ヶ島・土肥・西伊豆","ProductPrefectureName":"静岡県","GoogleReviewRate":3.6,"GoogleReviewCount":1121}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
