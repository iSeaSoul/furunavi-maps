ice":2000,"CategoryName":"グルメ","Latitude":37.048118,"Longitude":136.9635734,"AreaName":"和倉・輪島・羽咋","ProductPrefectureName":"石川県","GoogleReviewRate":4.1,"GoogleReviewCount":185},{"ProductId":11784,"Title":"蛇之目寿司","Price":3000,"CategoryName":"グルメ","Latitude":37.0891523,"Longitude":136.9156332,"AreaName":"和倉・輪島・羽咋","ProductPrefectureName":"石川県","GoogleReviewRate":4.1,"GoogleReviewCount":179},{"ProductId":3344,"Title":"日本の宿　のと楽","Price":29000,"CategoryName":"宿泊施設","Latitude":37.0857526,"Longitude":136.9263268,"AreaName":"和倉・輪島・羽咋","ProductPrefectureName":"石川県","GoogleReviewRate":4,"GoogleReviewCount":1673},{"ProductId":3338,"Title":"ガーデン能登屋","Price":14000,"CategoryName":"宿泊施設","Latitude":37.0857526,"Longitude":136.9263268,"AreaName":"和倉・輪島・羽咋","ProductPrefectureName":"石川県","GoogleReviewRate":4,"GoogleReviewCount":1673},{"ProductId":3343,"Title":"ホテル能登倶楽部","Price":25000,"CategoryName":"宿泊施設","Latitude":37.0850569,"Longitude":136.9263021,"AreaName":"和倉・輪島・羽咋","ProductPrefectureName":"石川県","GoogleReviewRate":3.8,"GoogleReviewCount":12},{"ProductId":4530,"Title":"航心丸","Price":4300,"CategoryName":"その他","Latitude":37.2300139,"Longitude":136.9108339,"AreaName":"和倉・輪島・羽咋","ProductPrefectureName":"石川県","GoogleReviewRate":5,"GoogleReviewCount":5},{"ProductId":4495,"Title":"小山屋醤油店","Price":1500,"CategoryName":"その他","Latitude":37.044516,"Longitude":136.966084,"AreaName":"和倉・輪島・羽咋","ProductPrefectureName":"石川県","GoogleReviewRate":4.5,"GoogleReviewCount":13},{"ProductId":6359,"Title":"はまづる","Price":10000,"CategoryName":"宿泊施設","Latitude":37.0871088,"Longitude":136.9227418,"AreaName":"和倉・輪島・羽咋","ProductPrefectureName":"石川県","GoogleReviewRate":3.6,"GoogleReviewCount":153},{"ProductId":3290,"Title":"大呑ビレッジ　遊心庵","Price":28000,"CategoryName":"宿泊施設","Latitude":36.9816212,"Longitude":137.0416456,"AreaName":"和倉・輪島・羽咋","ProductPrefectureName":"石川県","GoogleReviewRate":4.5,"GoogleReviewCount":10},{"ProductId":11373,"Title":"アートと泊まる一棟貸しの宿tonot","Price":15000,"CategoryName":"宿泊施設","Latitude":37.1414735,"Longitude":136.8720299,"AreaName":"和倉・輪島・羽咋","ProductPrefectureName":"石川県","GoogleReviewRate":3.3,"GoogleReviewCount":3}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
