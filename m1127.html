Rate":4.2,"GoogleReviewCount":47},{"ProductId":4396,"Title":"割烹　松屋","Price":80000,"CategoryName":"グルメ","Latitude":34.4079293,"Longitude":135.3245277,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":4.1,"GoogleReviewCount":96},{"ProductId":4501,"Title":"中国料理「星龍」（スターゲイトホテル関西エアポート内）","Price":10000,"CategoryName":"グルメ","Latitude":34.4111792,"Longitude":135.3000064,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":4.1,"GoogleReviewCount":71},{"ProductId":8541,"Title":"ファーストキャビン関西空港","Price":7000,"CategoryName":"宿泊施設","Latitude":34.4371558,"Longitude":135.2435364,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":4,"GoogleReviewCount":372},{"ProductId":4384,"Title":"関空温泉ホテルガーデンパレス　レストラン「和み」","Price":4000,"CategoryName":"グルメ","Latitude":34.4029674,"Longitude":135.3172022,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":4,"GoogleReviewCount":21},{"ProductId":4383,"Title":"（日帰り温泉）関空温泉ホテルガーデンパレス","Price":5000,"CategoryName":"その他","Latitude":34.4029432,"Longitude":135.3171903,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":4.1,"GoogleReviewCount":771},{"ProductId":11777,"Title":"waterfront kitchen garden（関西エアポートワシントンホテル内）","Price":3500,"CategoryName":"グルメ","Latitude":34.4110959,"Longitude":135.3015845,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":3.9,"GoogleReviewCount":170},{"ProductId":4462,"Title":"美食俱楽部一歩 泉佐野店","Price":12000,"CategoryName":"グルメ","Latitude":34.4028194,"Longitude":135.3138694,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":3.9,"GoogleReviewCount":268},{"ProductId":11653,"Title":"和彩「花ざと」（ホテル日航関西空港内）","Price":6000,"CategoryName":"グルメ","Latitude":34.4369042,"Longitude":135.2430653,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":3.5,"GoogleReviewCount":21},{"ProductId":4500,"Title":"スカイダイニング256「スターゲイト」（スターゲイトホテル関西エアポート内）","Price":5000,"CategoryName":"グルメ","Latitude":34.4112228,"Longitude":135.2998995,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":3.8,"GoogleReviewCount":151},{"ProductId":4503,"Title":"日本料理「天翠」（スターゲイトホテル関西エアポート内）","Price":10000,"CategoryName":"グルメ","Latitude":34.4112109,"Longitude":135.2999226,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":3.5,"GoogleReviewCount":30},{"ProductId":7717,"Title":"み奈美亭","Price":18000,"CategoryName":"宿泊施設","Latitude":34.3422775,"Longitude":135.3748016,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":3.8,"GoogleReviewCount":641},{"ProductId":7467,"Title":"ホテルサンプラスユタカ","Price":5000,"CategoryName":"宿泊施設","Latitude":34.4200103,"Longitude":135.3272145,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":3.6,"GoogleReviewCount":189},{"ProductId":7365,"Title":"ホテルシーガル","Price":8000,"CategoryName":"宿泊施設","Latitude":34.4247336,"Longitude":135.3268805,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":3.6,"GoogleReviewCount":216},{"ProductId":7466,"Title":"ホテルニューユタカ","Price":5000,"CategoryName":"宿泊施設","Latitude":34.4116787,"Longitude":135.3310828,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":3.4,"GoogleReviewCount":131},{"ProductId":5407,"Title":"YAKINIKU BUFFET左近 りんくうシークル店","Price":2500,"CategoryName":"グルメ","Latitude":34.4083768,"Longitude":135.2959821,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":3.6,"GoogleReviewCount":491},{"ProductId":5408,"Title":"バイキング左近  末広店","Price":2500,"CategoryName":"グルメ","Latitude":34.3998938,"Longitude":135.3104892,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":3.5,"GoogleReviewCount":621},{"ProductId":7426,"Title":"シティホテルエアポートインプリンス","Price":5000,"CategoryName":"宿泊施設","Latitude":34.412243,"Longitude":135.3157017,"AreaName":"大阪南部","ProductPrefectureName":"大阪府","GoogleReviewRate":3.3,"GoogleReviewCount":414}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
