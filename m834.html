<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>長野県上田市 提携店マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;
    padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);
    max-width:min(340px,75vw);font-size:13px}
  #panel input[type=text]{width:100%;margin:3px 0;font-size:13px;box-sizing:border-box}
  .cats label{margin-right:8px;white-space:nowrap}
  .popup a{display:inline-block;margin:3px 6px 0 0}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <a href="index.html">← 自治体一覧</a>
  <div><b>長野県上田市</b> <span id="count"></span></div>
  <input id="q" type="text" placeholder="店名・エリアで検索">
  <div class="cats" id="cats"></div>
  <button id="locate">📍 現在地</button>
  <a target="_blank" href="https://tp.furunavi.jp/Municipal/PlanSearch?municipalId=834">ふるなびで見る</a>
  <div style="color:#888;font-size:11px">Data: tp.furunavi.jp (2026-10-07)</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const STORES = [{"ProductId":8082,"Title":"かしわや本店","Price":65000,"CategoryName":"宿泊施設","Latitude":36.3501491,"Longitude":138.1558383,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.7,"GoogleReviewCount":289},{"ProductId":3322,"Title":"別所温泉　七草の湯","Price":28000,"CategoryName":"宿泊施設","Latitude":36.3510768,"Longitude":138.1553306,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.6,"GoogleReviewCount":352},{"ProductId":3324,"Title":"旅館　中松屋","Price":25000,"CategoryName":"宿泊施設","Latitude":36.3503589,"Longitude":138.1552917,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.5,"GoogleReviewCount":467},{"ProductId":7908,"Title":"玉屋旅館","Price":29000,"CategoryName":"宿泊施設","Latitude":36.3492508,"Longitude":138.1601065,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.4,"GoogleReviewCount":307},{"ProductId":3312,"Title":"信州別所温泉 旅宿 上松や","Price":21000,"CategoryName":"宿泊施設","Latitude":36.350267,"Longitude":138.154932,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.3,"GoogleReviewCount":798},{"ProductId":11302,"Title":"別所温泉 緑屋","Price":18000,"CategoryName":"宿泊施設","Latitude":36.3489065,"Longitude":138.1599692,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.8,"GoogleReviewCount":110},{"ProductId":3303,"Title":"鹿教湯温泉　くつろぎの宿　黒岩旅館","Price":16000,"CategoryName":"宿泊施設","Latitude":36.303833,"Longitude":138.13773,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.6,"GoogleReviewCount":98},{"ProductId":3307,"Title":"別所温泉　南條旅館","Price":16000,"CategoryName":"宿泊施設","Latitude":36.3492697,"Longitude":138.1594403,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.3,"GoogleReviewCount":313},{"ProductId":3358,"Title":"斎藤ホテル","Price":19000,"CategoryName":"宿泊施設","Latitude":36.300461,"Longitude":138.136661,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.2,"GoogleReviewCount":484},{"ProductId":13417,"Title":"若菜館","Price":5000,"CategoryName":"グルメ","Latitude":36.3974239,"Longitude":138.2496672,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.2,"GoogleReviewCount":294},{"ProductId":10068,"Title":"桃月庵","Price":1400,"CategoryName":"グルメ","Latitude":36.3822897,"Longitude":138.2400784,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.5,"GoogleReviewCount":24},{"ProductId":3293,"Title":"鹿教湯温泉　鹿乃屋旅館","Price":10000,"CategoryName":"宿泊施設","Latitude":36.299655,"Longitude":138.134575,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":4.2,"GoogleReviewCount":126},{"ProductId":5864,"Title":"上田温泉祥園・寿久庵","Price":13000,"CategoryName":"宿泊施設","Latitude":36.3988828,"Longitude":138.249578,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":3.9,"GoogleReviewCount":322},{"ProductId":8438,"Title":"きのこむら深山","Price":2000,"CategoryName":"グルメ","Latitude":36.3484289,"Longitude":138.1936814,"AreaName":"上田・戸倉上山田・軽井沢","ProductPrefectureName":"長野県","GoogleReviewRate":3.4,"GoogleReviewCount":594}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
