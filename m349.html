<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福島県会津若松市 提携店マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;
    padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);
    max-width:min(340px,75vw);font-size:13px}
  #panel input[type=text]{width:100%;margin:3px 0;font-size:13px;box-sizing:border-box}
  .cats label{margin-right:8px;white-space:nowrap}
  .popup a{display:inline-block;margin:3px 6px 0 0}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <a href="index.html">← 自治体一覧</a>
  <div><b>福島県会津若松市</b> <span id="count"></span></div>
  <input id="q" type="text" placeholder="店名・エリアで検索">
  <div class="cats" id="cats"></div>
  <button id="locate">📍 現在地</button>
  <a target="_blank" href="https://tp.furunavi.jp/Municipal/PlanSearch?municipalId=349">ふるなびで見る</a>
  <div style="color:#888;font-size:11px">Data: tp.furunavi.jp (2026-10-07)</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const STORES = [{"ProductId":9361,"Title":"会津芦ノ牧温泉 大川荘","Price":11000,"CategoryName":"宿泊施設","Latitude":37.3668585,"Longitude":139.913719,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":4.3,"GoogleReviewCount":2348},{"ProductId":8137,"Title":"盃爛処","Price":5000,"CategoryName":"グルメ","Latitude":37.4995705,"Longitude":139.9292869,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":4.6,"GoogleReviewCount":278},{"ProductId":3883,"Title":"会津芦ノ牧温泉　離れ山翠","Price":44000,"CategoryName":"宿泊施設","Latitude":37.3664392,"Longitude":139.9101506,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":4.1,"GoogleReviewCount":907},{"ProductId":14905,"Title":"料理旅館 田事","Price":20000,"CategoryName":"宿泊施設","Latitude":37.5019293,"Longitude":139.9234254,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":4.3,"GoogleReviewCount":534},{"ProductId":14903,"Title":"料理旅館 田事 （レストラン）","Price":5000,"CategoryName":"グルメ","Latitude":37.5019293,"Longitude":139.9234254,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":4.3,"GoogleReviewCount":534},{"ProductId":8108,"Title":"いろりの宿　芦名","Price":28000,"CategoryName":"宿泊施設","Latitude":37.4754757,"Longitude":139.9630107,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":4.4,"GoogleReviewCount":168},{"ProductId":3826,"Title":"今昔亭","Price":25000,"CategoryName":"宿泊施設","Latitude":37.4741287,"Longitude":139.9617473,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":4.3,"GoogleReviewCount":255},{"ProductId":3822,"Title":"不動館小谷の湯","Price":14000,"CategoryName":"宿泊施設","Latitude":37.3651128,"Longitude":139.9170948,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":4.2,"GoogleReviewCount":321},{"ProductId":14820,"Title":"会津居酒屋 籠太","Price":6000,"CategoryName":"グルメ","Latitude":37.4949522,"Longitude":139.9325344,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":4.2,"GoogleReviewCount":317},{"ProductId":3827,"Title":"原瀧","Price":20000,"CategoryName":"宿泊施設","Latitude":37.4752778,"Longitude":139.9625,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":4.1,"GoogleReviewCount":895},{"ProductId":7054,"Title":"会津東山温泉　鶴我総本山","Price":125000,"CategoryName":"宿泊施設","Latitude":37.4845859,"Longitude":139.9527539,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":4.9,"GoogleReviewCount":10},{"ProductId":3817,"Title":"渓流の宿 渓山","Price":18000,"CategoryName":"宿泊施設","Latitude":37.3679545,"Longitude":139.9118068,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":4.3,"GoogleReviewCount":88},{"ProductId":15061,"Title":"元湯 有馬屋","Price":15000,"CategoryName":"宿泊施設","Latitude":37.478169,"Longitude":139.962529,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":4,"GoogleReviewCount":68},{"ProductId":3881,"Title":"会津芦ノ牧温泉 丸峰観光ホテル","Price":12000,"CategoryName":"宿泊施設","Latitude":37.366344,"Longitude":139.9100741,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":4,"GoogleReviewCount":278},{"ProductId":6945,"Title":"芦ノ牧プリンスホテル","Price":13000,"CategoryName":"宿泊施設","Latitude":37.365982,"Longitude":139.9134216,"AreaName":"会津若松・東山・芦ノ牧・喜多方","ProductPrefectureName":"福島県","GoogleReviewRate":3.8,"GoogleReviewCount":341}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
