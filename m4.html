<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>北海道旭川市 提携店マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;
    padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);
    max-width:min(340px,75vw);font-size:13px}
  #panel input[type=text]{width:100%;margin:3px 0;font-size:13px;box-sizing:border-box}
  .cats label{margin-right:8px;white-space:nowrap}
  .popup a{display:inline-block;margin:3px 6px 0 0}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <a href="index.html">← 自治体一覧</a>
  <div><b>北海道旭川市</b> <span id="count"></span></div>
  <input id="q" type="text" placeholder="店名・エリアで検索">
  <div class="cats" id="cats"></div>
  <button id="locate">📍 現在地</button>
  <a target="_blank" href="https://tp.furunavi.jp/Municipal/PlanSearch?municipalId=4">ふるなびで見る</a>
  <div style="color:#888;font-size:11px">Data: tp.furunavi.jp (2026-10-07)</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const STORES = [{"ProductId":10364,"Title":"JRイン旭川","Price":12000,"CategoryName":"宿泊施設","Latitude":43.763641,"Longitude":142.357339,"AreaName":"旭川・層雲峡","ProductPrefectureName":"北海道","GoogleReviewRate":4.3,"GoogleReviewCount":2667},{"ProductId":9533,"Title":"天然温泉 神威の湯 ドーミーイン旭川","Price":8000,"CategoryName":"宿泊施設","Latitude":43.7709351,"Longitude":142.3601393,"AreaName":"旭川・層雲峡","ProductPrefectureName":"北海道","GoogleReviewRate":4.2,"GoogleReviewCount":1914},{"ProductId":10700,"Title":"ワイズホテル旭川駅前","Price":10000,"CategoryName":"宿泊施設","Latitude":43.7628038,"Longitude":142.3598246,"AreaName":"旭川・層雲峡","ProductPrefectureName":"北海道","GoogleReviewRate":4.2,"GoogleReviewCount":1088},{"ProductId":10753,"Title":"和風旅館　扇松園","Price":11000,"CategoryName":"宿泊施設","Latitude":43.766207,"Longitude":142.3129638,"AreaName":"旭川・層雲峡","ProductPrefectureName":"北海道","GoogleReviewRate":4.2,"GoogleReviewCount":460},{"ProductId":10433,"Title":"桜岡リトリートロッジ Norheim","Price":60000,"CategoryName":"宿泊施設","Latitude":43.79156,"Longitude":142.4939442,"AreaName":"旭川・層雲峡","ProductPrefectureName":"北海道","GoogleReviewRate":5,"GoogleReviewCount":10},{"ProductId":9513,"Title":"高砂温泉","Price":12000,"CategoryName":"宿泊施設","Latitude":43.7597323,"Longitude":142.3192604,"AreaName":"旭川・層雲峡","ProductPrefectureName":"北海道","GoogleReviewRate":3.9,"GoogleReviewCount":1319},{"ProductId":10769,"Title":"桜岡リトリートオーベルジュ Sondre Cabin B「Old Table」","Price":41000,"CategoryName":"宿泊施設","Latitude":43.7910476,"Longitude":142.4964147,"AreaName":"旭川・層雲峡","ProductPrefectureName":"北海道","GoogleReviewRate":5,"GoogleReviewCount":7},{"ProductId":10768,"Title":"桜岡リトリートオーベルジュ Sondre Cabin A「Wood Stove」","Price":41000,"CategoryName":"宿泊施設","Latitude":43.7910476,"Longitude":142.4964147,"AreaName":"旭川・層雲峡","ProductPrefectureName":"北海道","GoogleReviewRate":5,"GoogleReviewCount":7},{"ProductId":9837,"Title":"アートホテル旭川","Price":10000,"CategoryName":"宿泊施設","Latitude":43.772493,"Longitude":142.3604,"AreaName":"旭川・層雲峡","ProductPrefectureName":"北海道","GoogleReviewRate":3.9,"GoogleReviewCount":3467}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
