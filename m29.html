":56},{"ProductId":12874,"Title":"ヤキトリツヨシ 富良野店","Price":3000,"CategoryName":"グルメ","Latitude":43.3453583,"Longitude":142.3884484,"AreaName":"富良野・サホロ・トマム","ProductPrefectureName":"北海道","GoogleReviewRate":4,"GoogleReviewCount":87},{"ProductId":4363,"Title":"森のダイニング（ホテルナトゥールヴァルト富良野）","Price":5000,"CategoryName":"グルメ","Latitude":43.342531,"Longitude":142.360797,"AreaName":"富良野・サホロ・トマム","ProductPrefectureName":"北海道","GoogleReviewRate":4,"GoogleReviewCount":1144},{"ProductId":4316,"Title":"ホテルナトゥールヴァルト富良野","Price":25000,"CategoryName":"宿泊施設","Latitude":43.342531,"Longitude":142.360797,"AreaName":"富良野・サホロ・トマム","ProductPrefectureName":"北海道","GoogleReviewRate":4,"GoogleReviewCount":1144},{"ProductId":10351,"Title":"山の独尊","Price":4000,"CategoryName":"グルメ","Latitude":43.345067,"Longitude":142.362649,"AreaName":"富良野・サホロ・トマム","ProductPrefectureName":"北海道","GoogleReviewRate":3.9,"GoogleReviewCount":38},{"ProductId":3821,"Title":"石邸富良野","Price":50000,"CategoryName":"宿泊施設","Latitude":43.346066,"Longitude":142.3906,"AreaName":"富良野・サホロ・トマム","ProductPrefectureName":"北海道","GoogleReviewRate":4.9,"GoogleReviewCount":18},{"ProductId":11675,"Title":"ホテルふらのヴェルデ","Price":25000,"CategoryName":"宿泊施設","Latitude":43.3708111,"Longitude":142.333467,"AreaName":"富良野・サホロ・トマム","ProductPrefectureName":"北海道","GoogleReviewRate":4.6,"GoogleReviewCount":25},{"ProductId":11638,"Title":"チセフクロウ","Price":160000,"CategoryName":"宿泊施設","Latitude":43.3220934,"Longitude":142.3629565,"AreaName":"富良野・サホロ・トマム","ProductPrefectureName":"北海道","GoogleReviewRate":5,"GoogleReviewCount":8},{"ProductId":11641,"Title":"富良野ロッジ10","Price":160000,"CategoryName":"宿泊施設","Latitude":43.3374228,"Longitude":142.361527,"AreaName":"富良野・サホロ・トマム","ProductPrefectureName":"北海道","GoogleReviewRate":4.5,"GoogleReviewCount":16},{"ProductId":11644,"Title":"Shochikubai","Price":150000,"CategoryName":"宿泊施設","Latitude":43.3374654,"Longitude":142.3617682,"AreaName":"富良野・サホロ・トマム","ProductPrefectureName":"北海道","GoogleReviewRate":5,"GoogleReviewCount":1},{"ProductId":11646,"Title":"ワイルドウッド","Price":150000,"CategoryName":"宿泊施設","Latitude":43.3376534,"Longitude":142.3618486,"AreaName":"富良野・サホロ・トマム","ProductPrefectureName":"北海道","GoogleReviewRate":0,"GoogleReviewCount":0}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
