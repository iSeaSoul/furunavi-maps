  #panel input[type=text]{width:100%;margin:3px 0;font-size:13px;box-sizing:border-box}
  .cats label{margin-right:8px;white-space:nowrap}

:"新潟県","GoogleReviewRate":4,"GoogleReviewCount":85},{"ProductId":11904,"Title":"シュプールイン苗場","Price":11000,"CategoryName":"宿泊施設","Latitude":36.7886563,"Longitude":138.7917849,"AreaName":"塩沢・越後湯沢・六日町","ProductPrefectureName":"新潟県","GoogleReviewRate":4.6,"GoogleReviewCount":40},{"ProductId":3301,"Title":"KKR湯沢ゆきぐに","Price":15000,"CategoryName":"宿泊施設","Latitude":36.9368806,"Longitude":138.8047321,"AreaName":"塩沢・越後湯沢・六日町","ProductPrefectureName":"新潟県","GoogleReviewRate":4.2,"GoogleReviewCount":193},{"ProductId":4985,"Title":"越後のお宿 いなもと","Price":18000,"CategoryName":"宿泊施設","Latitude":36.9363591,"Longitude":138.8072055,"AreaName":"塩沢・越後湯沢・六日町","ProductPrefectureName":"新潟県","GoogleReviewRate":4.1,"GoogleReviewCount":507},{"ProductId":3211,"Title":"the kinta Naeba","Price":18000,"CategoryName":"宿泊施設","Latitude":36.787056,"Longitude":138.786559,"AreaName":"塩沢・越後湯沢・六日町","ProductPrefectureName":"新潟県","GoogleReviewRate":4.2,"GoogleReviewCount":86},{"ProductId":3256,"Title":"越後湯沢温泉 一望千里 御湯宿 中屋","Price":25000,"CategoryName":"宿泊施設","Latitude":36.9466508,"Longitude":138.7995216,"AreaName":"塩沢・越後湯沢・六日町","ProductPrefectureName":"新潟県","GoogleReviewRate":4.1,"GoogleReviewCount":332},{"ProductId":3210,"Title":"越後湯沢温泉　さくら亭","Price":17000,"CategoryName":"宿泊施設","Latitude":36.9331678,"Longitude":138.8108581,"AreaName":"塩沢・越後湯沢・六日町","ProductPrefectureName":"新潟県","GoogleReviewRate":4.1,"GoogleReviewCount":319},{"ProductId":5678,"Title":"湯沢釜蔵","Price":5000,"CategoryName":"グルメ","Latitude":36.93705,"Longitude":138.807701,"AreaName":"塩沢・越後湯沢・六日町","ProductPrefectureName":"新潟県","GoogleReviewRate":4,"GoogleReviewCount":492},{"ProductId":4747,"Title":"和みのお宿 滝乃湯","Price":21000,"CategoryName":"宿泊施設","Latitude":36.9383655,"Longitude":138.8045247,"AreaName":"塩沢・越後湯沢・六日町","ProductPrefectureName":"新潟県","GoogleReviewRate":4,"GoogleReviewCount":284},{"ProductId":3296,"Title":"エンゼルグランディア越後中里","Price":12000,"CategoryName":"宿泊施設","Latitude":36.904659,"Longitude":138.8488922,"AreaName":"塩沢・越後湯沢・六日町","ProductPrefectureName":"新潟県","GoogleReviewRate":4,"GoogleReviewCount":3022},{"ProductId":3218,"Title":"御宿本陣　仙山亭","Price":21000,"CategoryName":"宿泊施設","Latitude":36.7878038,"Longitude":138.7959305,"AreaName":"塩沢・越後湯沢・六日町","ProductPrefectureName":"新潟県","GoogleReviewRate":3.9,"GoogleReviewCount":337},{"ProductId":3201,"Title":"御宿本陣","Price":11000,"CategoryName":"宿泊施設","Latitude":36.7878028,"Longitude":138.7957619,"AreaName":"塩沢・越後湯沢・六日町","ProductPrefectureName":"新潟県","GoogleReviewRate":3.9,"GoogleReviewCount":337},{"ProductId":3199,"Title":"御宿本陣別館　苗場ウエスト・貸切コテージ","Price":8000,"CategoryName":"宿泊施設","Latitude":36.7878028,"Longitude":138.7957619,"AreaName":"塩沢・越後湯沢・六日町","ProductPrefectureName":"新潟県","GoogleReviewRate":3.9,"GoogleReviewCount":337},{"ProductId":12258,"Title":"湯沢東映ホテル","Price":15000,"CategoryName":"宿泊施設","Latitude":36.938948,"Longitude":138.803427,"AreaName":"塩沢・越後湯沢・六日町","ProductPrefectureName":"新潟県","GoogleReviewRate":3.9,"GoogleReviewCount":896},{"ProductId":14446,"Title":"リブマックスリゾート越後湯沢","Price":18000,"CategoryName":"宿泊施設","Latitude":36.9377248,"Longitude":138.8054199,"AreaName":"塩沢・越後湯沢・六日町","ProductPrefectureName":"新潟県","GoogleReviewRate":3.3,"GoogleReviewCount":156}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
