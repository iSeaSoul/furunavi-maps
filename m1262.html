<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>和歌山県那智勝浦町 提携店マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;
    padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);
    max-width:min(340px,75vw);font-size:13px}
  #panel input[type=text]{width:100%;margin:3px 0;font-size:13px;box-sizing:border-box}
  .cats label{margin-right:8px;white-space:nowrap}
  .popup a{display:inline-block;margin:3px 6px 0 0}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <a href="index.html">← 自治体一覧</a>
  <div><b>和歌山県那智勝浦町</b> <span id="count"></span></div>
  <input id="q" type="text" placeholder="店名・エリアで検索">
  <div class="cats" id="cats"></div>
  <button id="locate">📍 現在地</button>
  <a target="_blank" href="https://tp.furunavi.jp/Municipal/PlanSearch?municipalId=1262">ふるなびで見る</a>
  <div style="color:#888;font-size:11px">Data: tp.furunavi.jp (2026-10-07)</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const STORES = [{"ProductId":2636,"Title":"碧き島の宿 熊野別邸 中の島","Price":45000,"CategoryName":"宿泊施設","Latitude":33.6203905,"Longitude":135.9471803,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":4.4,"GoogleReviewCount":806},{"ProductId":6602,"Title":"海つばめ","Price":5000,"CategoryName":"グルメ","Latitude":33.6253247,"Longitude":135.9511561,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":4.7,"GoogleReviewCount":204},{"ProductId":2616,"Title":"ホテル浦島山上館","Price":26000,"CategoryName":"宿泊施設","Latitude":33.6253549,"Longitude":135.9509604,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":4.1,"GoogleReviewCount":5345},{"ProductId":2594,"Title":"ホテル浦島","Price":17000,"CategoryName":"宿泊施設","Latitude":33.6253549,"Longitude":135.9509604,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":4.1,"GoogleReviewCount":5345},{"ProductId":2596,"Title":"万清楼","Price":18000,"CategoryName":"宿泊施設","Latitude":33.6279296,"Longitude":135.9460601,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":4.3,"GoogleReviewCount":486},{"ProductId":2585,"Title":"Temple Hotel大泰寺","Price":10000,"CategoryName":"宿泊施設","Latitude":33.5895697,"Longitude":135.9024056,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":4.6,"GoogleReviewCount":108},{"ProductId":2645,"Title":"休暇村 南紀勝浦","Price":15000,"CategoryName":"宿泊施設","Latitude":33.6593214,"Longitude":135.9847296,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":4.2,"GoogleReviewCount":951},{"ProductId":4659,"Title":"和か屋本店　お滝茶屋","Price":1000,"CategoryName":"グルメ","Latitude":33.6700188,"Longitude":135.8926596,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":4.2,"GoogleReviewCount":453},{"ProductId":4736,"Title":"吾作","Price":3000,"CategoryName":"グルメ","Latitude":33.6341802,"Longitude":135.9350537,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":4.3,"GoogleReviewCount":160},{"ProductId":2599,"Title":"ホテル浦島　なぎさ館・日昇館","Price":19000,"CategoryName":"宿泊施設","Latitude":33.6271923,"Longitude":135.9513042,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":4.1,"GoogleReviewCount":812},{"ProductId":4189,"Title":"（日帰り温泉）休暇村 南紀勝浦","Price":1000,"CategoryName":"その他","Latitude":33.6593214,"Longitude":135.9847296,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":4.2,"GoogleReviewCount":951},{"ProductId":7121,"Title":"まぐろ三昧 那智","Price":1500,"CategoryName":"グルメ","Latitude":33.6282012,"Longitude":135.9439444,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":4,"GoogleReviewCount":840},{"ProductId":4468,"Title":"紀の松島観光株式会社","Price":1700,"CategoryName":"その他","Latitude":33.6279646,"Longitude":135.9455866,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":4.4,"GoogleReviewCount":66},{"ProductId":2598,"Title":"南紀勝浦温泉　ホテルなぎさや","Price":19000,"CategoryName":"宿泊施設","Latitude":33.6181165,"Longitude":135.9386298,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":3.7,"GoogleReviewCount":409},{"ProductId":3357,"Title":"亀の井ホテル 那智勝浦","Price":19000,"CategoryName":"宿泊施設","Latitude":33.6333942,"Longitude":135.9431082,"AreaName":"串本・勝浦","ProductPrefectureName":"和歌山県","GoogleReviewRate":3.7,"GoogleReviewCount":1377}];
const COLORS = {"宿泊施設":"#1e88e5","グルメ":"#e53935"};
const map = L.map('map',{preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const cluster = L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:16});
map.addLayer(cluster);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(s){
  const gq = encodeURIComponent(s.Title + ' ' + (s.ProductPrefectureName||''));
  return `<div class="popup"><b>${esc(s.Title)}</b><br>
   ${esc(s.CategoryName)} ・ ${esc(s.AreaName||'')}<br>
   目安 ${s.Price ? s.Price.toLocaleString() : '-'} pt
   ${s.GoogleReviewRate ? ` ・ ★${s.GoogleReviewRate} (${s.GoogleReviewCount})` : ''}<br>
   <a target="_blank" href="https://tp.furunavi.jp/Plan/Detail?plId=${s.ProductId}">ふるなび詳細</a>
   <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gq}">Google Maps</a>
   <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.Latitude},${s.Longitude}">経路</a></div>`;
}
STORES.forEach(s=>{
  s.marker = L.circleMarker([s.Latitude,s.Longitude],{radius:7,weight:1,color:'#fff',
    fillColor:COLORS[s.CategoryName]||'#43a047',fillOpacity:.9}).bindPopup(()=>popup(s));
  s.search = (s.Title+' '+(s.AreaName||'')).toLowerCase();
});
const cats=[...new Set(STORES.map(s=>s.CategoryName))];
const catDiv=document.getElementById('cats');
cats.forEach(c=>{const n=STORES.filter(s=>s.CategoryName===c).length;
  catDiv.insertAdjacentHTML('beforeend',
  `<label><input type="checkbox" class="cat" value="${esc(c)}" checked>
   <span style="color:${COLORS[c]||'#43a047'}">●</span>${esc(c)} (${n})</label>`);});
function apply(fit){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const on=new Set([...document.querySelectorAll('.cat:checked')].map(x=>x.value));
  const sel=STORES.filter(s=>on.has(s.CategoryName) && (!q || s.search.includes(q)));
  cluster.clearLayers(); cluster.addLayers(sel.map(s=>s.marker));
  document.getElementById('count').textContent=`${sel.length} / ${STORES.length} 件`;
  if(fit && sel.length) map.fitBounds(L.latLngBounds(sel.map(s=>[s.Latitude,s.Longitude])),{padding:[30,30],maxZoom:15});
}
document.getElementById('q').oninput=()=>apply(true);
catDiv.onchange=()=>apply(false);
document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:14});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy}).addTo(map));
map.setView([36.5,137.5],5);
apply(true);
</script></body></html>
